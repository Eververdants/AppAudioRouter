[package]
name = "app-audio-router"
version = "2.3.0"
description = "Per-app audio routing tool for Windows"
authors = ["Eververdants"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# The `tauri` crate is kept on the same minor as `@tauri-apps/api` /
# `@tauri-apps/cli` in package.json — a compatibility convention (the JS API and
# the core are released together and their IPC assumes matching versions), not a
# build gate: the CLI's only version check compares `@tauri-apps/cli` to its own
# bundled native binding and never reads the crate, so nothing catches a crate/npm
# mismatch automatically. Bump them together by hand.
# `devtools` is deliberately absent: debug builds enable the inspector through
# `debug_assertions`, while release builds must ship with it disabled.
tauri = { version = "2.11", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
tokio = { version = "1.43", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "implement",
] }
# Direct dependency so the `implement` macro can emit `::windows_core::...`.
windows-core = "0.58"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Startup-oriented release profile. A cold start pays for mapping and faulting in
# the executable, so trade build time for a smaller, denser image: full LTO with a
# single codegen unit lets LLVM inline across crate boundaries and drop the code
# that never runs, `strip` removes the symbol tables, and the low opt level keeps
# the binary compact. `panic = "abort"` also removes the unwinding tables.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
incremental = false
