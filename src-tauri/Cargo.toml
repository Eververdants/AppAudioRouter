[package]
name = "app-audio-router"
version = "2.0.0"
description = "Per-app audio routing tool for Windows"
authors = ["Eververdants"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# These requirements are kept in step with the JS packages in package.json:
# the Tauri CLI refuses to build when the crate and the npm package for the
# same component disagree on the minor version.
tauri = { version = "2.11", features = [] }
tauri-plugin-store = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
tokio = { version = "1.43", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant",
  "implement",
] }
# Direct dependency so the `implement` macro can emit `::windows_core::...`.
windows-core = "0.58"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Startup-oriented release profile. A cold start pays for mapping and faulting in
# the executable, so trade build time for a smaller, denser image: full LTO with a
# single codegen unit lets LLVM inline across crate boundaries and drop the code
# that never runs, `strip` removes the symbol tables, and the low opt level keeps
# the binary compact. `panic = "abort"` also removes the unwinding tables.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
incremental = false
