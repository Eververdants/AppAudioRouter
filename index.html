<!doctype html>
<!--
  This file is a template. Its tokens — names wrapped in percent signs — are
  filled at build time by scripts/site-meta.ts from src/lib/site.ts and the
  i18n locale files, and the build writes one document per language:
  dist/index.html (zh-CN) and dist/en/index.html (en). `npm run dev` fills the
  tokens for the default language on the fly. Never hard-code a version, a URL
  or a language here; change the source of truth instead.
-->
<html lang="%HTML_LANG%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="keywords" content="%KEYWORDS%" />
    <meta name="author" content="%AUTHOR%" />
    <!-- max-snippet / max-image-preview lifted so answer engines and AI
         Overviews may quote the page at length instead of truncating it. -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <!-- TODO(placeholder): add search-console verification tags here once the
         production domain is confirmed (Google Search Console / Bing
         Webmaster / Baidu 站长平台各一行 meta)。 -->
    <link rel="canonical" href="%CANONICAL%" />
    <!-- Language alternates: each language has a URL of its own, so the pair
         is a real hreflang cluster rather than one URL claiming two. -->
%HREFLANG%

    <!-- Open Graph / Twitter: absolute image URLs per the OG spec. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="App Audio Router" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:url" content="%OG_URL%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1800" />
    <meta property="og:image:height" content="1360" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta property="og:locale" content="%OG_LOCALE%" />
%OG_LOCALE_ALTERNATE%
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%OG_TITLE%" />
    <meta name="twitter:description" content="%OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />

    <!-- Structured data: Organization / WebSite / WebPage / SoftwareApplication
         as one graph, generated per language. The FAQPage node is emitted at
         runtime from src/components/Faq.tsx instead, so it always mirrors the
         visible copy in whichever language the reader switched to. -->
    <script type="application/ld+json">
      %JSONLD%
    </script>
    <!--
      Boot script + critical CSS, inlined on purpose (same pattern as the
      desktop app's index.html, with website-specific storage keys).

      Running them before the module script makes the very first paint already
      carry the correct background, text colour and language, so there is no
      flash while the bundle loads.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme;
        try {
          theme = localStorage.getItem('aar-website-theme');
        } catch (error) {
          /* storage may be unavailable; fall through to the system preference */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.classList.toggle('dark', theme === 'dark');
        root.dataset.theme = theme;

        // Match the language the bundle is about to render in, so CJK text is
        // not laid out with the wrong font on the first frame. The URL wins
        // over the stored preference: /en/ promises English to whoever opened
        // it, exactly as it promises it to a crawler.
        try {
          var language = /\/en\/?$/.test(window.location.pathname)
            ? 'en'
            : localStorage.getItem('aar-website-language');
          if (language === 'zh-CN' || language === 'en') root.lang = language;
        } catch (error) {
          /* ignore */
        }
      })();
    </script>
    <style>
      /* Critical shell. The two custom properties below are duplicated verbatim
         in styles/index.css, which loads later and simply re-declares them. */
      :root {
        --bg-primary: #fafafa;
        --text-primary: #18181b;
      }
      .dark {
        --bg-primary: #09090b;
        --text-primary: #fafafa;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #root {
        min-height: 100vh;
      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- The whole page as static, semantic HTML for clients that never run the
         bundle: most answer-engine crawlers fetch raw markup and do not
         execute JavaScript, so this is the copy they can quote. Generated
         from the locale files at build time, in the page's own language. -->
    <noscript>%NOSCRIPT%</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
