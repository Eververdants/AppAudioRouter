    <script type="application/ld+json">

          "逐设备音量平衡(per-device volume balance)",
          "无需虚拟声卡驱动(no virtual audio driver)",
          "按程序自动记忆路由(auto-remember routes per executable)"
        ],
        "author": {
          "@type": "Organization",
          "name": "Eververdants",
          "url": "https://github.com/Eververdants"
        },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!--
      Boot script + critical CSS, inlined on purpose (same pattern as the
      desktop app's index.html, with website-specific storage keys).

      Running them before the module script makes the very first paint already
      carry the correct background, text colour and language, so there is no
      flash while the bundle loads.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme;
        try {
          theme = localStorage.getItem('aar-website-theme');
        } catch (error) {
          /* storage may be unavailable; fall through to the system preference */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.classList.toggle('dark', theme === 'dark');
        root.dataset.theme = theme;

        // Match the language the bundle is about to render in, so CJK text is
        // not laid out with the wrong font on the first frame.
        try {
          var language = localStorage.getItem('aar-website-language');
          if (language === 'zh-CN' || language === 'en') root.lang = language;
        } catch (error) {
          /* ignore */
        }
      })();
    </script>
    <style>

         in styles/index.css, which loads later and simply re-declares them. */
      :root {
