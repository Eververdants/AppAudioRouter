name: CI

on:
  # Every push and every pull request: three layers of tests plus the static
  # checks, whatever branch the work is on.
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

jobs:
  # Layer 0 — the code has to be well-formed before it is worth testing.
  frontend-check:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  # Layer 1 — unit tests: the store, the helpers and the command layer, against
  # a scripted fake of the Tauri IPC (Vitest + jsdom). No audio, no shell.
  unit-test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Layer 2 — end-to-end: what a user does, in a real browser against the real
  # UI, with the same fake backend behind the IPC so it needs neither Windows
  # nor a sound card.
  e2e-test:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Bump the key together with the pinned @playwright/test version.
          key: ${{ runner.os }}-playwright-1.63.0

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload the failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The Rust half: the same checks as before, on the platform it ships on.
  rust-check:
    name: Rust Check & Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt check
        run: cargo fmt -- --check
        working-directory: src-tauri

      - name: cargo check
        run: cargo check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri
