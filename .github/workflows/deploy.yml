name: Deploy website to GitHub Pages

on:
  push:
    branches: [website]
  workflow_dispatch:

# Pages deployments need the Pages write scope plus OIDC for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push supersedes a run in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
