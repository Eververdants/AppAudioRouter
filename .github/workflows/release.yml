name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    name: Build ${{ matrix.platform }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App Audio Router ${{ github.ref_name }}'
          # The release page is an indexed landing page, so it carries the
          # same description and links as the README instead of a placeholder.
          releaseBody: |
            Per-app audio routing for Windows 10 and 11 — send one program to several output devices at once, each with its own delay compensation and its own volume. No virtual audio driver and no third-party executable.

            ### Install

            Download the `.msi` installer, or the NSIS `-setup.exe`, from the assets below and run it. WebView2 is the only runtime requirement, and it ships with Windows 11.

            ### Documentation

            - [English README](https://github.com/Eververdants/AppAudioRouter#readme)
            - [简体中文说明](https://github.com/Eververdants/AppAudioRouter/blob/main/README.zh-CN.md)
            - [Commits in this release](https://github.com/Eververdants/AppAudioRouter/commits/${{ github.ref_name }})

            Built from the tag by GitHub Actions — a dependency audit runs first, then the installers are compiled on `windows-latest`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
