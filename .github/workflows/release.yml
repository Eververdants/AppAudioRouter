name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    name: Build ${{ matrix.platform }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App Audio Router ${{ github.ref_name }}'
          # The release page is an indexed landing page, so it carries the
          # same description and links as the README instead of a placeholder.
          releaseBody: |
            Per-app audio routing for Windows 10 and 11 — send one program to several output devices at once, each with its own delay compensation and its own volume; since 2.3.0, send one program's output into another program's input. Routing calls Core Audio directly from one native binary: no helper process, and no driver bundled or installed by the app. Feeds run through a loopback endpoint pair you install and name once in Settings.

            ### What's in this release

            - **Send one program into another's input** — the destination picker lists every program that can take sound in; selecting one connects it on the spot, with undo in the toast. The loopback pair is picked in Settings, and an unconfigured pair is named on the board rather than pretended past.
            - **Delay calibration wizard** — each device plays a short tone in turn, you tap when you hear it, and the measured differences are written as the compensation.
            - **A tray menu that does the whole job** — settings, start-with-Windows, stop all routes, quit; in the interface's own language.
            - **The first run is a tour** — four screens on a new machine; an upgrade answers one question first, what to do with the previous version's settings.

            ### Install

            Download the `.msi` installer, or the NSIS `-setup.exe`, from the assets below and run it. WebView2 is the only runtime requirement, and it ships with Windows 11.

            ### Documentation

            - [English README](https://github.com/Eververdants/AppAudioRouter#readme)
            - [简体中文说明](https://github.com/Eververdants/AppAudioRouter/blob/main/README.zh-CN.md)
            - [Commits in this release](https://github.com/Eververdants/AppAudioRouter/commits/${{ github.ref_name }})

            Built from the tag by GitHub Actions — a dependency audit runs first, then the installers are compiled on `windows-latest`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Confirm and publish
    needs: build
    runs-on: ubuntu-latest
    # The confirmation gate: the `release` environment carries a required
    # reviewer, so the run pauses here until it is approved in the Actions tab
    # ("Review deployments"). Approving turns the draft the build job made
    # into the live release — no visit to the Releases page, no manual
    # publishing, and nothing goes out without that one press.
    environment: release
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          --repo "${{ github.repository }}"
