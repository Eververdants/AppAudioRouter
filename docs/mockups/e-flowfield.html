<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 E · 声流图 — App Audio Router 2.3.0 主界面提案</title>
<style>
:root{
  --bg-primary:#eef0f3;--bg-tertiary:#e8e8ec;
  --text-primary:#18181b;--text-secondary:#3f3f46;--text-muted:#71717a;
  --accent:#0891b2;--accent-hover:#0e7490;--accent-muted:rgba(8,145,178,.12);--accent-ink:#ffffff;
  --surface:#ffffff;--surface-hover:rgba(24,24,27,.035);
  --hairline:#e6e6ea;--hairline-strong:#d4d4da;
  --shadow-float:0 1px 2px rgba(24,40,66,.06),0 8px 24px rgba(24,40,66,.1);
  --type-primary:#0891b2;--type-mirror:#0f766e;--type-idle:#94a3b8;--type-feed:#b45309;
}
.dark{
  --bg-primary:#0b0e14;--bg-tertiary:#27272a;
  --text-primary:#fafafa;--text-secondary:#d4d4d8;--text-muted:#a1a1aa;
  --accent:#22d3ee;--accent-hover:#06b6d4;--accent-muted:rgba(34,211,238,.14);--accent-ink:#05222b;
  --surface:#12151a;--surface-hover:rgba(255,255,255,.035);
  --hairline:#23272e;--hairline-strong:#2e3742;
  --shadow-float:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --type-primary:#22d3ee;--type-mirror:#14b8a6;--type-idle:#64748b;--type-feed:#fbbf24;
}
*{margin:0;box-sizing:border-box}
body{min-height:100vh;background:#e3e5ea;padding:22px 0 34px;display:flex;flex-direction:column;align-items:center;gap:14px;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#18181b}
body.dark{background:#04060a;color:#fafafa}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.mnote{width:980px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:#52525b}
body.dark .mnote{color:#9494a0}
.mnote b{font-size:13px;color:#18181b}
body.dark .mnote b{color:#fafafa}
.mnote a{color:#0e7490;text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer;white-space:nowrap}
body.dark .mnote a{color:#22d3ee}
.mnote .sp{flex:1}
.tbtn2{border:1px solid #d4d4da;background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;color:#18181b}
body.dark .tbtn2{border-color:#2e3742;background:#161c24;color:#fafafa}
.win{width:980px;height:680px;flex:none;background:var(--bg-primary);border:1px solid var(--hairline-strong);border-radius:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.30);display:flex;flex-direction:column;overflow:hidden;color:var(--text-primary)}
.tbar{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.branddot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ver{font-size:10.5px;color:var(--text-muted);border:1px solid var(--hairline-strong);padding:1px 7px;border-radius:999px}
.tcount{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.tbtn{width:32px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--text-muted);cursor:pointer;font-size:12px}
.tbtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.tbtn.close:hover{background:rgba(239,68,68,.14);color:var(--error)}
.tabs{height:32px;flex:none;display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--hairline);font-size:12.5px;color:var(--text-muted)}
.tab{padding:8px 2px;position:relative}
.tab.on{color:var(--text-primary);font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
/* 图区 */
.graphwrap{flex:1;overflow:auto;position:relative}
#canvas{position:relative;width:940px;height:540px;margin:0 auto}
#gw{position:absolute;inset:0;pointer-events:none}
.glegend{position:absolute;top:10px;left:16px;right:16px;display:flex;gap:18px;font-size:10.5px;color:var(--text-muted);pointer-events:none}
.glegend .r{margin-left:auto}
.gcap{position:absolute;width:150px;text-align:center;font-size:10.5px;color:var(--text-muted);letter-spacing:.1em;pointer-events:none}
.node{position:absolute;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--surface);
  border:1px solid var(--hairline-strong);box-shadow:var(--shadow-float);transition:border-color .15s,opacity .2s}
.node:hover{border-color:var(--accent)}
.node.src{width:48px;height:48px}
.node.snk{width:44px;height:44px}
.node.mute{opacity:.38}
.node.off{background:transparent;border-color:var(--hairline-strong);box-shadow:none}
.node.self{opacity:.25;cursor:default;pointer-events:none}
.sring{border-radius:50%;border:1.5px solid var(--type-idle);display:grid;place-items:center}
.node.src .sring{width:20px;height:20px}
.node.snk .sring{width:18px;height:18px}
.sring.pri{border-color:var(--type-primary)}
.sring.mir{border-color:var(--type-mirror)}
.sring.feed{border-color:var(--type-feed)}
.sring .core{border-radius:50%;background:var(--type-primary);opacity:0}
.node.src .sring .core{width:8px;height:8px}
.node.snk .sring .core{width:6px;height:6px}
.sring .core.on{opacity:1}
.sring .core.feed{background:var(--type-feed)}
.mic{color:var(--text-muted)}
.mic.hot{color:var(--type-feed)}
.nlab{position:absolute;width:140px;text-align:center;pointer-events:none}
.rlab{position:absolute;width:200px;text-align:left;pointer-events:none}
.nname{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nsub{font-size:9.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wire{fill:none;stroke-width:2;stroke-linecap:round}
.wire.pri{stroke:var(--type-primary)}
.wire.mir{stroke:var(--type-mirror)}
.wire.feed{stroke:var(--type-feed)}
.wire.flow{stroke-dasharray:4 10;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.wire.dimmed{opacity:.13}
.trunkline{stroke:var(--text-muted);stroke-width:2;stroke-linecap:round}
.trunkline.flow{stroke-dasharray:4 10;animation:dash .6s linear infinite}
.trunkline.dimmed{opacity:.13}
.jdot{fill:var(--text-muted)}
.jdot.dimmed{opacity:.13}
/* 检查器 */
.insp{flex:none;border-top:1px solid var(--hairline);min-height:76px;padding:11px 22px;display:flex;align-items:center;gap:22px;overflow-x:auto}
.insp .hint{font-size:11.5px;color:var(--text-muted)}
.insp .who{display:flex;align-items:center;gap:9px;flex:none}
.insp .who .nm{font-weight:700;font-size:13px}
.item{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:9px;
  padding:4px 8px;font-size:11px;white-space:nowrap}
.item .lb{color:var(--text-secondary)}
.stp{display:flex;align-items:center;gap:4px}
.stp .tv{font-size:11px;min-width:46px;text-align:center;color:var(--text-secondary)}
.stp button{width:17px;height:17px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;
  font-size:11px;color:var(--text-muted);cursor:pointer;line-height:1}
.stp button:hover{background:var(--accent-muted);color:var(--accent)}
</style>
</head>
<body>
<div class="mnote">
  <b>方案 E · 声流图</b>
  <span>承认 A→B 之后路由是<b>一张图</b>：左列程序、右列去向（设备 + 程序输入），<b>一条线就是一份声音</b>，多路复制在分岔点上画一个结（分岔＝复制，箭头＝流向）。点程序聚焦看它的调音，聚焦后点去向改线。</span>
  <span class="sp"></span>
  <a href="index.html">← 全部方案</a>
  <button class="tbtn2" onclick="document.body.classList.toggle('dark')">◐ 主题</button>
</div>

<div class="win">
  <div class="tbar">
    <div class="brand"><span class="branddot"></span>App Audio Router<span class="ver mono">v2.3.0</span></div>
    <div class="tcount mono" id="tcount"></div>
    <div class="tbtn" title="设置">⚙</div>
    <div class="tbtn">—</div><div class="tbtn">□</div><div class="tbtn close">✕</div>
  </div>
  <div class="tabs"><span class="tab on">路由</span><span class="tab">活动</span></div>
  <div class="graphwrap">
    <div id="canvas">
      <div class="glegend">
        <span>一条线＝一份声音 · 分岔点＝复制 · 箭头＝流向</span>
        <span class="r">点程序聚焦 · 聚焦后点右侧去向改线</span>
      </div>
      <svg id="gw" width="940" height="540">
        <defs>
          <marker id="arr-pri" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--type-primary)"></path></marker>
          <marker id="arr-mir" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--type-mirror)"></path></marker>
          <marker id="arr-feed" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--type-feed)"></path></marker>
        </defs>
      </svg>
      <div id="nodes" style="position:absolute;inset:0"></div>
    </div>
  </div>
  <div class="insp" id="insp"></div>
</div>

<script>
const DEVICES=[
  {id:'spk', name:'扬声器',      sub:'Realtek(R) Audio'},
  {id:'hp',  name:'WH-1000XM5', sub:'蓝牙耳机'},
  {id:'hdmi',name:'DELL U2723', sub:'HDMI'},
];
const DEF='spk';
const PROCS=[
  {id:'spotify',name:'Spotify',        exe:'spotify.exe',       pid:8124, playing:true,  dev:['spk','hp'], feed:['discord']},
  {id:'edge',   name:'Microsoft Edge', exe:'msedge.exe',        pid:9312, playing:true,  dev:[],           feed:['obs']},
  {id:'discord',name:'Discord',        exe:'Discord.exe',       pid:7788, playing:true,  dev:[],           feed:[]},
  {id:'obs',    name:'OBS Studio',     exe:'obs64.exe',         pid:6420, playing:false, dev:[],           feed:[]},
  {id:'game',   name:'Cyberpunk 2077', exe:'Cyberpunk2077.exe', pid:5120, playing:true,  dev:['hp'],       feed:[]},
];
const DELAY={spk:0,hdmi:0,hp:40};
const SHARE={spk:100,hdmi:100,hp:100};
const FEEDVOL={discord:80,obs:60};
const PVOL={spotify:100,edge:100,discord:100,obs:100,game:100};

const CANVAS={W:940,H:540};
const SRC_X=140,SINK_X=660,SD=48,KD=44;
const srcY=i=>92+i*80;
const devY=i=>100+i*56;
const inY0=282,inDY=56;
let focus=null;

const P=id=>PROCS.find(p=>p.id===id);
const D=id=>DEVICES.find(d=>d.id===id);
const DEV_IDX=Object.fromEntries(DEVICES.map((d,i)=>[d.id,i]));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const sinkY=t=>t.kind==='dev'?devY(DEV_IDX[t.id]):inY0+PROCS.findIndex(p=>p.id===t.id)*inDY;

function toggleDev(pid,id){
  const r=P(pid);const i=r.dev.indexOf(id);
  if(i>=0){if(r.dev.length===1)return;r.dev.splice(i,1)}else r.dev.push(id);
  render();
}
function toggleFeed(pid,id){
  const r=P(pid);const i=r.feed.indexOf(id);
  if(i>=0)r.feed.splice(i,1);else r.feed.push(id);
  render();
}
function focusSrc(id){focus=focus===id?null:id;render()}
function nd(id,d){DELAY[id]=Math.max(0,Math.min(200,DELAY[id]+d));render()}
function ns(id,d){SHARE[id]=Math.max(0,Math.min(100,SHARE[id]+d));render()}
function nf(id,d){FEEDVOL[id]=Math.max(0,Math.min(100,(FEEDVOL[id]??100)+d));render()}
function np(id,d){PVOL[id]=Math.max(5,Math.min(100,PVOL[id]+d));render()}

function wirePath(x1,y1,x2,y2,cls,flow,dimcls){
  const mx=(x1+x2)/2;
  return`<path class="wire ${cls}${flow?' flow':''}${dimcls}" d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" marker-end="url(#arr-${cls})"></path>`;
}

function render(){
  /* ---- 线 ---- */
  let w='';
  PROCS.forEach((s,i)=>{
    const dests=[
      ...s.dev.map((id,k)=>({kind:'dev',id,cls:k===0?'pri':'mir'})),
      ...s.feed.map(id=>({kind:'in',id,cls:'feed'})),
    ];
    if(!dests.length)return;
    const sy=srcY(i),sx=SRC_X+SD/2,jx=sx+48;
    const dimcls=focus&&focus!==s.id?' dimmed':'';
    const flow=s.playing?' flow':'';
    if(dests.length===1){
      const t=dests[0];
      w+=wirePath(sx,sy,SINK_X-KD/2,sinkY(t),t.cls,flow,dimcls);
    }else{
      w+=`<line class="trunkline${flow}${dimcls}" x1="${sx}" y1="${sy}" x2="${jx}" y2="${sy}"></line>`;
      w+=`<circle class="jdot${dimcls}" cx="${jx}" cy="${sy}" r="4.5"></circle>`;
      dests.forEach(t=>{
        w+=wirePath(jx,sy,SINK_X-KD/2,sinkY(t),t.cls,flow,dimcls);
      });
    }
  });
  document.getElementById('gw').innerHTML=w;

  /* ---- 节点 ---- */
  let n='';
  /* 列头 */
  n+=`<div class="gcap" style="left:${SRC_X-75}px;top:52px">程序（声源）</div>`;
  n+=`<div class="gcap" style="left:${SINK_X-75}px;top:58px">输出设备</div>`;
  n+=`<div class="gcap" style="left:${SINK_X-75}px;top:${inY0-42}px">程序输入</div>`;

  PROCS.forEach((s,i)=>{
    const y=srcY(i);
    const routed=s.dev.length>0;
    const dim=focus&&focus!==s.id?' mute':'';
    n+=`<div class="node src ${routed?'':'off'}${dim}" style="left:${SRC_X-SD/2}px;top:${y-SD/2}px"
        onclick="focusSrc('${s.id}')" title="聚焦「${esc(s.name)}」${focus===s.id?'（再点一次取消）':''}">
      <span class="sring ${routed?'pri':''}"><span class="core ${s.playing?'on':''}"></span></span></div>
    <div class="nlab" style="left:${SRC_X-70}px;top:${y+SD/2+5}px">
      <div class="nname">${esc(s.name)}</div>
      <div class="nsub mono">${esc(s.exe)}</div></div>`;
  });

  DEVICES.forEach((d,i)=>{
    const y=devY(i);
    const users=PROCS.filter(p=>p.dev.includes(d.id)&&p.playing);
    let ring='',core='';
    if(focus){
      const f=P(focus),k=f.dev.indexOf(d.id);
      if(k>=0){ring=k===0?'pri':'mir';core=f.playing?'on':''}
    }
    const title=focus?`${d.name}：${P(focus).dev.includes(d.id)?'点按撤下这条去向':'点按接到「'+P(focus).name+'」'}`:'先点左侧一个程序，再点这里改线';
    n+=`<div class="node snk" style="left:${SINK_X-KD/2}px;top:${y-KD/2}px" onclick="${focus?`toggleDev('${focus}','${d.id}')`:''}" title="${esc(title)}">
      <span class="sring ${ring}"><span class="core ${users.length?'on':''} ${ring==='mir'?'feed':''}" style="${ring?'':'background:var(--type-idle)'}"></span></span></div>
    <div class="rlab" style="left:${SINK_X+KD/2+10}px;top:${y-17}px">
      <div class="nname">${esc(d.name)}</div>
      <div class="nsub">${esc(d.sub)}</div></div>`;
  });

  PROCS.forEach((q,j)=>{
    const y=inY0+j*inDY;
    const senders=PROCS.filter(p=>p.feed.includes(q.id)&&p.playing);
    const receiving=PROCS.some(p=>p.feed.includes(q.id));
    const self=focus===q.id;
    let ring='',core='';
    if(focus&&!self){
      const f=P(focus);
      if(f.feed.includes(q.id)){ring='feed';core=f.playing?'on':''}
    }
    const micCls=receiving||ring==='feed'?'mic hot':'mic';
    const title=self?'不能把程序送进它自己'
      :focus?`「${q.name}」的输入：${P(focus).feed.includes(q.id)?'点按停止送入':'点按把「'+P(focus).name+'」送进来'}`
      :'先点左侧一个程序，再点这里改线';
    n+=`<div class="node snk ${self?'self':''}" style="left:${SINK_X-KD/2}px;top:${y-KD/2}px" onclick="${focus&&!self?`toggleFeed('${focus}','${q.id}')`:''}" title="${esc(title)}">
      <svg class="${micCls}" width="16" height="16" viewBox="0 0 14 14"><rect x="5" y="1.5" width="4" height="7" rx="2" fill="currentColor"/><path d="M3.5 6.5a3.5 3.5 0 0 0 7 0" stroke="currentColor" fill="none" stroke-width="1.4"/><line x1="7" y1="10" x2="7" y2="12.5" stroke="currentColor" stroke-width="1.4"/></svg></div>
    <div class="rlab" style="left:${SINK_X+KD/2+10}px;top:${y-17}px">
      <div class="nname">${esc(q.name)} 的输入</div>
      <div class="nsub">${receiving?senders.length?`收到自 ${esc(senders.map(s=>s.name).join('、'))}`:'有程序送入':'未在收音'}</div></div>`;
  });
  document.getElementById('nodes').innerHTML=n;

  /* ---- 检查器 ---- */
  const insp=document.getElementById('insp');
  if(!focus){
    insp.innerHTML='<span class="hint">点击左侧一个程序聚焦它 —— 在这里看它的调音；聚焦后点击右侧任意去向即可改线。</span>';
  }else{
    const p=P(focus);
    let items='';
    if(p.dev.length===0){
      items=`<span class="hint">未路由到设备 —— 跟着系统默认设备（${esc(D(DEF).name)}）走。</span>`;
    }else p.dev.forEach((id,k)=>{
      if(k===0){
        items+=`<div class="item"><span class="lb" style="color:var(--type-primary)">主输出</span><b>${esc(D(id).name)}</b>
          <span class="lb">会话音量</span>
          <span class="stp"><button onclick="np('${p.id}',-5)">−</button><span class="tv mono">${PVOL[p.id]} %</span><button onclick="np('${p.id}',5)">＋</button></span></div>`;
      }else{
        items+=`<div class="item"><span class="lb" style="color:var(--type-mirror)">副本</span><b>${esc(D(id).name)}</b>
          <span class="lb">延迟</span>
          <span class="stp"><button onclick="nd('${id}',-10)">−</button><span class="tv mono">${DELAY[id]} ms</span><button onclick="nd('${id}',10)">＋</button></span>
          <span class="lb">份额</span>
          <span class="stp"><button onclick="ns('${id}',-5)">−</button><span class="tv mono">${SHARE[id]} %</span><button onclick="ns('${id}',5)">＋</button></span></div>`;
      }
    });
    p.feed.forEach(id=>{
      items+=`<div class="item"><span class="lb" style="color:var(--type-feed)">送入</span><b>${esc(P(id).name)} 的输入</b>
        <span class="lb">音量</span>
        <span class="stp"><button onclick="nf('${id}',-5)">−</button><span class="tv mono">${FEEDVOL[id]??100} %</span><button onclick="nf('${id}',5)">＋</button></span></div>`;
    });
    insp.innerHTML=`<div class="who">
      <span class="sring ${p.dev.length?'pri':''}" style="width:16px;height:16px"><span class="core ${p.playing?'on':''}" style="width:6px;height:6px"></span></span>
      <span><span class="nm">${esc(p.name)}</span><br><span class="nsub mono">${esc(p.exe)} · ${p.playing?'正在播放':'未在播放'}</span></span></div>${items}`;
  }

  const routedN=PROCS.filter(p=>p.dev.length>0).length;
  document.getElementById('tcount').textContent=`已路由 ${routedN} · 播放中 ${PROCS.filter(p=>p.playing).length}`;
}

render();
</script>
</body>
</html>
