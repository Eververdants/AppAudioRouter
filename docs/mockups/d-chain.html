<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 D · 链路 — App Audio Router 2.3.0 主界面提案</title>
<style>
:root{
  --bg-primary:#eef0f3;--bg-tertiary:#e8e8ec;
  --text-primary:#18181b;--text-secondary:#3f3f46;--text-muted:#71717a;
  --accent:#0891b2;--accent-hover:#0e7490;--accent-muted:rgba(8,145,178,.12);--accent-ink:#ffffff;
  --surface:#ffffff;--surface-hover:rgba(24,24,27,.035);
  --hairline:#e6e6ea;--hairline-strong:#d4d4da;
  --shadow-float:0 1px 2px rgba(24,40,66,.06),0 8px 24px rgba(24,40,66,.1);
  --type-primary:#0891b2;--type-mirror:#0f766e;--type-idle:#94a3b8;--type-feed:#b45309;
}
.dark{
  --bg-primary:#0b0e14;--bg-tertiary:#27272a;
  --text-primary:#fafafa;--text-secondary:#d4d4d8;--text-muted:#a1a1aa;
  --accent:#22d3ee;--accent-hover:#06b6d4;--accent-muted:rgba(34,211,238,.14);--accent-ink:#05222b;
  --surface:#12151a;--surface-hover:rgba(255,255,255,.035);
  --hairline:#23272e;--hairline-strong:#2e3742;
  --shadow-float:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --type-primary:#22d3ee;--type-mirror:#14b8a6;--type-idle:#64748b;--type-feed:#fbbf24;
}
*{margin:0;box-sizing:border-box}
body{min-height:100vh;background:#e3e5ea;padding:22px 0 34px;display:flex;flex-direction:column;align-items:center;gap:14px;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#18181b}
body.dark{background:#04060a;color:#fafafa}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.mnote{width:980px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:#52525b}
body.dark .mnote{color:#9494a0}
.mnote b{font-size:13px;color:#18181b}
body.dark .mnote b{color:#fafafa}
.mnote a{color:#0e7490;text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer;white-space:nowrap}
body.dark .mnote a{color:#22d3ee}
.mnote .sp{flex:1}
.tbtn2{border:1px solid #d4d4da;background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;color:#18181b}
body.dark .tbtn2{border-color:#2e3742;background:#161c24;color:#fafafa}
.win{width:980px;height:680px;flex:none;background:var(--bg-primary);border:1px solid var(--hairline-strong);border-radius:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.30);display:flex;flex-direction:column;overflow:hidden;color:var(--text-primary);position:relative}
.tbar{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.branddot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ver{font-size:10.5px;color:var(--text-muted);border:1px solid var(--hairline-strong);padding:1px 7px;border-radius:999px}
.tcount{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.tbtn{width:32px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--text-muted);cursor:pointer;font-size:12px}
.tbtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.tbtn.close:hover{background:rgba(239,68,68,.14);color:var(--error)}
.mainarea{flex:1;position:relative;display:flex;flex-direction:column;min-height:0;overflow:auto}
.chead{flex:none;display:flex;gap:14px;padding:10px 18px 8px;font-size:11px;color:var(--text-muted)}
.chead .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chain{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--hairline);min-height:62px}
.chain:first-of-type{border-top:0}
.cwho{width:196px;flex:none;display:flex;align-items:center;gap:10px;min-width:0}
.ring{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--hairline-strong);display:grid;place-items:center}
.ring.main{border-color:var(--type-primary)}
.ring .core{width:7px;height:7px;border-radius:50%;background:var(--type-primary);opacity:0}
.ring .core.on{opacity:1}
.cname{min-width:0;display:flex;flex-direction:column;gap:1px}
.cname .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname .sb{font-size:9.5px;color:var(--text-muted)}
.flowline{flex:none;width:22px;height:12px;display:block}
.flowline line{stroke:var(--hairline-strong);stroke-width:2;stroke-linecap:round}
.flowline.live line{stroke:var(--type-primary);stroke-dasharray:3 5;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-8}}
.chiprow{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 12px;border-radius:999px;
  border:1px solid var(--hairline-strong);background:var(--surface);font-size:12px;cursor:default;white-space:nowrap}
.chip .cd{width:8px;height:8px;border-radius:50%;flex:none}
.chip.def{border-style:dashed;color:var(--text-muted);background:transparent}
.chip .chipx{position:absolute;right:-5px;top:-5px;width:15px;height:15px;border-radius:50%;background:var(--surface);
  border:1px solid var(--hairline-strong);display:none;place-items:center;font-size:9px;color:var(--text-muted);cursor:pointer;line-height:1}
.chip:hover .chipx{display:grid}
.chip .chipx:hover{color:var(--error);border-color:var(--error)}
.chip .sub{font-size:9.5px;color:var(--text-muted);font-weight:400}
.addchip{width:27px;height:27px;border-radius:50%;border:1px dashed var(--hairline-strong);display:grid;place-items:center;
  color:var(--text-muted);cursor:pointer;font-size:14px;flex:none}
.addchip:hover{color:var(--accent);border-color:var(--accent)}
.pop{position:absolute;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:12px;
  box-shadow:var(--shadow-float);width:250px;padding:6px;z-index:40}
.pop .glabel{font-size:10px;color:var(--text-muted);letter-spacing:.06em;padding:6px 10px 3px}
.pop .prow{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;display:flex;gap:8px;align-items:center}
.pop .prow:hover{background:var(--surface-hover)}
.pop .prow .ds{font-size:10px;color:var(--text-muted);margin-left:auto}
.toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--hairline-strong);
  border-radius:999px;box-shadow:var(--shadow-float);padding:7px 8px 7px 16px;font-size:12.5px;display:flex;align-items:center;
  gap:10px;z-index:50;white-space:nowrap}
.toast .u{border:0;background:var(--accent-muted);color:var(--accent);font-size:12px;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="mnote">
  <b>方案 D · 链路</b>
  <span>最平铺直白的一版：每个程序一行「信号链」，去向是一串胶囊芯片（首枚＝主输出，琥珀＝送进程序），悬停出现 ✕，行尾 ＋ 添加。没有舞台、没有图——列表本身就是路由。</span>
  <span class="sp"></span>
  <a href="index.html">← 全部方案</a>
  <button class="tbtn2" onclick="document.body.classList.toggle('dark')">◐ 主题</button>
</div>

<div class="win">
  <div class="tbar">
    <div class="brand"><span class="branddot"></span>App Audio Router<span class="ver mono">v2.3.0</span></div>
    <div class="tcount mono" id="tcount"></div>
    <div class="tbtn" title="设置">⚙</div>
    <div class="tbtn">—</div><div class="tbtn">□</div><div class="tbtn close">✕</div>
  </div>
  <div class="mainarea" id="main">
    <div class="chead">
      <span><span class="dot" style="background:var(--type-primary)"></span>主输出</span>
      <span><span class="dot" style="background:var(--type-mirror)"></span>副本</span>
      <span><span class="dot" style="background:var(--type-feed)"></span>送进程序</span>
      <span><span class="dot" style="border:1px dashed var(--text-muted);background:transparent"></span>跟随系统默认</span>
      <span style="margin-left:auto">改动即时生效，右下角可撤销</span>
    </div>
    <div id="rows"></div>
  </div>
  <div class="toast" id="toast" style="display:none"></div>
</div>

<script>
const DEVICES=[
  {id:'spk', name:'扬声器',      sub:'Realtek(R) Audio'},
  {id:'hp',  name:'WH-1000XM5', sub:'蓝牙耳机'},
  {id:'hdmi',name:'DELL U2723', sub:'HDMI'},
];
const DEF='spk';
const PROCS=[
  {id:'spotify',name:'Spotify',        exe:'spotify.exe',       pid:8124, playing:true,  dev:['spk','hp'], feed:['discord']},
  {id:'edge',   name:'Microsoft Edge', exe:'msedge.exe',        pid:9312, playing:true,  dev:[],           feed:['obs']},
  {id:'discord',name:'Discord',        exe:'Discord.exe',       pid:7788, playing:true,  dev:[],           feed:[]},
  {id:'obs',    name:'OBS Studio',     exe:'obs64.exe',         pid:6420, playing:false, dev:[],           feed:[]},
  {id:'game',   name:'Cyberpunk 2077', exe:'Cyberpunk2077.exe', pid:5120, playing:true,  dev:['hp'],       feed:[]},
];
const DELAY={spk:0,hdmi:0,hp:40};
const fedByNames=id=>PROCS.filter(p=>p.feed.includes(id)).map(p=>p.name);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

let undoSnap=null,undoTimer=null;
function snapshot(){return JSON.stringify(PROCS.map(p=>({id:p.id,dev:[...p.dev],feed:[...p.feed]})))}
function restore(s){const arr=JSON.parse(s);arr.forEach(r=>{const p=PROCS.find(x=>x.id===r.id);p.dev=r.dev;p.feed=r.feed})}

function removeChip(pid,kind,id){
  undoSnap=snapshot();
  const p=PROCS.find(x=>x.id===pid);
  if(kind==='dev'){if(p.dev.length>1)p.dev=p.dev.filter(x=>x!==id)}
  else p.feed=p.feed.filter(x=>x!==id);
  render();
  const nm=kind==='dev'?DEVICES.find(d=>d.id===id).name:PROCS.find(x=>x.id===id).name+' 的输入';
  showToast(`已把「${PROCS.find(x=>x.id===pid).name}」从 ${nm} 撤下。`);
}
function addChip(pid,kind,id){
  undoSnap=snapshot();
  const p=PROCS.find(x=>x.id===pid);
  if(kind==='dev'){if(!p.dev.includes(id))p.dev.push(id)}
  else if(!p.feed.includes(id))p.feed.push(id);
  closePop();render();
  const nm=kind==='dev'?DEVICES.find(d=>d.id===id).name:PROCS.find(x=>x.id===id).name+' 的输入';
  showToast(`已把「${p.name}」接到 ${nm}。`);
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg)+(undoSnap?' <button class="u" onclick="doUndo()">撤销</button>':'');
  t.style.display='flex';
  clearTimeout(undoTimer);undoTimer=setTimeout(()=>t.style.display='none',8000);
}
function doUndo(){if(undoSnap)restore(undoSnap);undoSnap=null;closePop();render();document.getElementById('toast').style.display='none'}

let popFor=null;
function openPop(pid,evt){
  const tr=evt.currentTarget.getBoundingClientRect(); // 先测量再重建，否则元素已被 innerHTML 换掉
  popFor=pid;render();
  const pop=document.getElementById('pop');
  if(!pop)return;
  const main=document.getElementById('main');
  const mr=main.getBoundingClientRect();
  const sl=main.scrollLeft, st=main.scrollTop;
  pop.style.left=Math.max(6,Math.min(tr.left-mr.left-40+sl,mr.width-266))+'px';
  pop.style.top=Math.min(tr.bottom-mr.top+6+st,mr.height-270)+'px';
}
function closePop(){popFor=null;const p=document.getElementById('pop');if(p)p.remove()}

function render(){
  document.getElementById('rows').innerHTML=PROCS.map(p=>{
    const chips=[];
    if(p.dev.length===0){
      chips.push(`<span class="chip def"><span class="cd" style="background:transparent;border:1px dashed var(--text-muted)"></span>
        跟随系统默认 · ${esc(DEVICES.find(d=>d.id===DEF).name)}<span class="chipx" title="移除" onclick="event.stopPropagation()">✕</span></span>`);
    }else{
      p.dev.forEach((id,i)=>{
        const d=DEVICES.find(x=>x.id===id);
        const tone=i===0?'var(--type-primary)':'var(--type-mirror)';
        chips.push(`<span class="chip" title="${esc(d.name)}（${esc(d.sub)}）${i===0?' · 主输出，系统直连':' · 副本，延迟 '+DELAY[id]+' ms'}">
          <span class="cd" style="background:${tone}"></span>${i===0?'<span class="sub">主</span>':''}${esc(d.name)}
          <span class="chipx" title="撤下" onclick="removeChip('${p.id}','dev','${id}')">✕</span></span>`);
      });
    }
    p.feed.forEach(id=>{
      chips.push(`<span class="chip" title="把声音送进「${esc(PROCS.find(x=>x.id===id).name)}」的输入">
        <span class="cd" style="background:var(--type-feed)"></span>${esc(PROCS.find(x=>x.id===id).name)}<span class="sub">的输入</span>
        <span class="chipx" title="撤下" onclick="removeChip('${p.id}','feed','${id}')">✕</span></span>`);
    });
    const live=p.playing&&(p.dev.length||p.feed.length);
    const fed=fedByNames(p.id);
    return`<div class="chain">
      <span class="cwho">
        <span class="ring ${p.dev.length?'main':''}"><span class="core ${p.playing?'on':''}"></span></span>
        <span class="cname"><span class="nm">${esc(p.name)}</span>
        <span class="sb mono">PID ${p.pid} · ${esc(p.exe)}${fed.length?' · ← '+esc(fed.join('、')):''}</span></span>
      </span>
      <svg class="flowline ${live?'live':''}" width="22" height="12"><line x1="0" y1="6" x2="20" y2="6"></line>
        <path d="M16 2 L20 6 L16 10" fill="none" stroke="${live?'var(--type-primary)':'var(--hairline-strong)'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span class="chiprow">${chips.join('')}
        <span class="addchip" title="添加去向" onclick="openPop('${p.id}',event)">＋</span></span>
    </div>`;
  }).join('')+(popFor?buildPop(popFor):'');

  const routedN=PROCS.filter(p=>p.dev.length>0).length;
  document.getElementById('tcount').textContent=`已路由 ${routedN} · 播放中 ${PROCS.filter(p=>p.playing).length}`;
}
function buildPop(pid){
  const p=PROCS.find(x=>x.id===pid);
  let h='<div class="pop" id="pop">';
  h+='<div class="glabel">输出设备</div>';
  h+=DEVICES.map(d=>p.dev.includes(d.id)
    ?`<div class="prow" style="opacity:.4;cursor:default">${esc(d.name)}<span class="ds">已接</span></div>`
    :`<div class="prow" onclick="addChip('${pid}','dev','${d.id}')">${esc(d.name)}<span class="ds">${esc(d.sub)}</span></div>`).join('');
  h+='<div class="glabel">程序输入</div>';
  h+=PROCS.filter(q=>q.id!==pid).map(q=>p.feed.includes(q.id)
    ?`<div class="prow" style="opacity:.4;cursor:default">${esc(q.name)} 的输入<span class="ds">已接</span></div>`
    :`<div class="prow" onclick="addChip('${pid}','feed','${q.id}')">${esc(q.name)} 的输入<span class="ds">${q.feed.includes(pid)?'（它也送给你）':''}</span></div>`).join('');
  return h+'</div>';
}

render();
document.addEventListener('pointerdown',e=>{
  if(popFor&&!e.target.closest('.pop')&&!e.target.closest('.addchip'))closePop();
});
</script>
</body>
</html>
