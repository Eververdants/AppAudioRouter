<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 B · 跳线板 — App Audio Router 2.3.0 主界面提案</title>
<style>
:root{
  --bg-primary:#eef0f3;--bg-tertiary:#e8e8ec;
  --text-primary:#18181b;--text-secondary:#3f3f46;--text-muted:#71717a;
  --accent:#0891b2;--accent-hover:#0e7490;--accent-muted:rgba(8,145,178,.12);--accent-ink:#ffffff;
  --surface:#ffffff;--surface-hover:rgba(24,24,27,.035);
  --hairline:#e6e6ea;--hairline-strong:#d4d4da;
  --shadow-float:0 1px 2px rgba(24,40,66,.06),0 8px 24px rgba(24,40,66,.1);
  --type-primary:#0891b2;--type-mirror:#0f766e;--type-idle:#94a3b8;--type-feed:#b45309;
}
.dark{
  --bg-primary:#0b0e14;--bg-tertiary:#27272a;
  --text-primary:#fafafa;--text-secondary:#d4d4d8;--text-muted:#a1a1aa;
  --accent:#22d3ee;--accent-hover:#06b6d4;--accent-muted:rgba(34,211,238,.14);--accent-ink:#05222b;
  --surface:#12151a;--surface-hover:rgba(255,255,255,.035);
  --hairline:#23272e;--hairline-strong:#2e3742;
  --shadow-float:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --type-primary:#22d3ee;--type-mirror:#14b8a6;--type-idle:#64748b;--type-feed:#fbbf24;
}
*{margin:0;box-sizing:border-box}
body{min-height:100vh;background:#e3e5ea;padding:22px 0 34px;display:flex;flex-direction:column;align-items:center;gap:14px;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#18181b}
body.dark{background:#04060a;color:#fafafa}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.mnote{width:980px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:#52525b}
body.dark .mnote{color:#9494a0}
.mnote b{font-size:13px;color:#18181b}
body.dark .mnote b{color:#fafafa}
.mnote a{color:#0e7490;text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer;white-space:nowrap}
body.dark .mnote a{color:#22d3ee}
.mnote .sp{flex:1}
.tbtn2{border:1px solid #d4d4da;background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;color:#18181b}
body.dark .tbtn2{border-color:#2e3742;background:#161c24;color:#fafafa}
.win{width:980px;height:680px;flex:none;background:var(--bg-primary);border:1px solid var(--hairline-strong);border-radius:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.30);display:flex;flex-direction:column;overflow:hidden;color:var(--text-primary)}
.tbar{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.branddot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ver{font-size:10.5px;color:var(--text-muted);border:1px solid var(--hairline-strong);padding:1px 7px;border-radius:999px}
.tcount{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.tbtn{width:32px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--text-muted);cursor:pointer;font-size:12px}
.tbtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.tbtn.close:hover{background:rgba(239,68,68,.14);color:var(--error)}
/* board */
.board{flex:1;position:relative;display:flex;min-height:0}
.srcs{width:270px;flex:none;border-right:1px solid var(--hairline);padding:10px 10px 10px 12px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.srcs h3,.sinks h3{font-size:11.5px;font-weight:600;color:var(--text-muted);padding:2px 10px 8px;letter-spacing:.05em}
.srow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.srow:hover{background:var(--surface-hover)}
.srow.sel{background:var(--surface);border-color:var(--hairline-strong);box-shadow:var(--shadow-float)}
.ring{width:14px;height:14px;flex:none;border-radius:50%;border:1.5px solid var(--hairline-strong);display:grid;place-items:center}
.ring.main{border-color:var(--type-primary)}
.ring .core{width:6px;height:6px;border-radius:50%;background:var(--type-primary);opacity:0}
.ring .core.on{opacity:1}
.rmain{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.rname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbadge{width:16px;height:16px;flex:none;border-radius:50%;background:var(--type-feed);color:#fff;font-size:9px;display:grid;place-items:center;font-weight:700}
.dark .fbadge{color:#3b2b05}
.sinks{flex:1;overflow:auto;padding:10px 18px 14px 130px}
.sinks .gap{height:14px}
.krow{display:flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid var(--hairline);border-radius:10px;
  background:var(--surface);cursor:pointer;margin-bottom:6px;transition:border-color .15s}
.krow:hover{border-color:var(--accent)}
.krow.lit{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.krow.litmir{border-color:var(--type-mirror);box-shadow:inset 3px 0 0 var(--type-mirror)}
.krow.litf{border-color:var(--type-feed);box-shadow:inset 3px 0 0 var(--type-feed)}
.krow .kico{width:15px;color:var(--text-muted);flex:none;display:grid;place-items:center}
.krow.lit .kico,.krow.litf .kico{color:var(--text-primary)}
.kmain{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.kname{font-size:12.5px;font-weight:600}
.ksub{font-size:10px;color:var(--text-muted)}
.ptag{font-size:9.5px;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px;line-height:15px}
.ksubrow{display:flex;align-items:center;gap:14px;padding:1px 12px 8px 38px;font-size:11px;color:var(--text-muted);margin-top:-4px}
.stp{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:8px;padding:1px 5px}
.stp .tv{font-size:10.5px;min-width:44px;text-align:center;color:var(--text-secondary)}
.stp button{width:16px;height:16px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;
  font-size:11px;color:var(--text-muted);cursor:pointer;line-height:1}
.stp button:hover{background:var(--accent-muted);color:var(--accent)}
/* cables */
#cab{position:absolute;inset:0;pointer-events:none}
.cable{fill:none;stroke-width:2;stroke-linecap:round;opacity:.85}
.cable.pri{stroke:var(--type-primary)}
.cable.mir{stroke:var(--type-mirror)}
.cable.feed{stroke:var(--type-feed)}
.cable.dim{opacity:.3}
.jack{stroke:none}
.jack.pri{fill:var(--type-primary)}
.jack.mir{fill:var(--type-mirror)}
.jack.feed{fill:var(--type-feed)}
.jack.dim{opacity:.3}
.cable.flow{stroke-dasharray:4 10;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
/* hint */
.hint{flex:none;border-top:1px solid var(--hairline);padding:7px 16px;font-size:11.5px;color:var(--text-muted);display:flex;gap:16px}
.hint b{color:var(--text-secondary);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 10px;vertical-align:baseline}
</style>
</head>
<body>
<div class="mnote">
  <b>方案 B · 跳线板</b>
  <span>调音台的 patchbay 隐喻：左列是正在出声的程序（声源），右列是所有去向（设备 + 程序输入），<b>线缆就是路由</b>。先选左、再点右；一屏看全所有程序的流向。</span>
  <span class="sp"></span>
  <a href="index.html">← 全部方案</a>
  <button class="tbtn2" onclick="document.body.classList.toggle('dark')">◐ 主题</button>
</div>

<div class="win">
  <div class="tbar">
    <div class="brand"><span class="branddot"></span>App Audio Router<span class="ver mono">v2.3.0</span></div>
    <div class="tcount mono" id="tcount"></div>
    <div class="tbtn" title="设置">⚙</div>
    <div class="tbtn">—</div><div class="tbtn">□</div><div class="tbtn close">✕</div>
  </div>
  <div class="board" id="board">
    <svg id="cab"></svg>
    <aside class="srcs" id="srcs"></aside>
    <section class="sinks" id="sinks"></section>
  </div>
  <div class="hint">
    <span><b>用法</b>：先点左边一个程序，再点右边要去的地方（再点一次取消）。首台设备为主输出，其余为副本。</span>
    <span style="margin-left:auto">
      <span class="dot" style="background:var(--type-primary)"></span>主输出
      <span class="dot" style="background:var(--type-mirror)"></span>副本
      <span class="dot" style="background:var(--type-feed)"></span>送进程序
    </span>
  </div>
</div>

<script>
const DEVICES=[
  {id:'spk', name:'扬声器',      sub:'Realtek(R) Audio'},
  {id:'hp',  name:'WH-1000XM5', sub:'蓝牙耳机'},
  {id:'hdmi',name:'DELL U2723', sub:'HDMI'},
];
const DEF='spk';
const PROCS=[
  {id:'spotify',name:'Spotify',        exe:'spotify.exe',       pid:8124, playing:true,  dev:['spk','hp'], feed:['discord']},
  {id:'edge',   name:'Microsoft Edge', exe:'msedge.exe',        pid:9312, playing:true,  dev:[],           feed:['obs']},
  {id:'discord',name:'Discord',        exe:'Discord.exe',       pid:7788, playing:true,  dev:[],           feed:[]},
  {id:'obs',    name:'OBS Studio',     exe:'obs64.exe',         pid:6420, playing:false, dev:[],           feed:[]},
  {id:'game',   name:'Cyberpunk 2077', exe:'Cyberpunk2077.exe', pid:5120, playing:true,  dev:['hp'],       feed:[]},
];
const DELAY={spk:0,hdmi:0,hp:40};
const SHARE={spk:100,hdmi:100,hp:100};
const FEEDVOL={discord:80,obs:60};
const PVOL={spotify:100,edge:100,discord:100,obs:100,game:100};

let sel='spotify';
const P=id=>PROCS.find(p=>p.id===id);
const D=id=>DEVICES.find(d=>d.id===id);
const fedByNames=id=>PROCS.filter(p=>p.feed.includes(id)).map(p=>p.name);
const lst=a=>a.length<=1?a.join(''):a.slice(0,-1).join('、')+' 和 '+a[a.length-1];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function select(id){sel=id;render()}
function toggleDev(id){
  const r=P(sel),i=r.dev.indexOf(id);
  if(i>=0){if(r.dev.length===1)return;r.dev.splice(i,1)}else r.dev.push(id);
  render();
}
function toggleFeed(id){
  const r=P(sel),i=r.feed.indexOf(id);
  if(i>=0)r.feed.splice(i,1);else r.feed.push(id);
  render();
}
function nd(id,d){DELAY[id]=Math.max(0,Math.min(200,DELAY[id]+d));render()}
function ns(id,d){SHARE[id]=Math.max(0,Math.min(100,SHARE[id]+d));render()}
function nf(id,d){FEEDVOL[id]=Math.max(0,Math.min(100,(FEEDVOL[id]??100)+d));render()}
function np(id,d){PVOL[id]=Math.max(5,Math.min(100,PVOL[id]+d));render()}

const SPK_SVG='<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 5h2.5L8 2v10L4.5 9H2z" fill="currentColor"/></svg>';
const MIC_SVG='<svg width="14" height="14" viewBox="0 0 14 14"><rect x="5" y="1.5" width="4" height="7" rx="2" fill="currentColor"/><path d="M3.5 6.5a3.5 3.5 0 0 0 7 0" stroke="currentColor" fill="none" stroke-width="1.4"/><line x1="7" y1="10" x2="7" y2="12.5" stroke="currentColor" stroke-width="1.4"/></svg>';

function render(){
  const cur=P(sel);
  /* 左列：声源 */
  document.getElementById('srcs').innerHTML='<h3>正在出声的程序（声源）</h3>'+PROCS.map(p=>{
    const parts=[];
    parts.push(p.dev.length===0?`→ 系统默认`:`→ ${D(p.dev[0]).name}${p.dev.length>1?' +'+(p.dev.length-1):''}`);
    if(p.feed.length)parts.push(`送入 ${p.feed.map(id=>P(id).name).join('、')}`);
    return`<div class="srow ${p.id===sel?'sel':''}" onclick="select('${p.id}')">
      <span class="ring ${p.dev.length?'main':''}"><span class="core ${p.playing?'on':''}"></span></span>
      <span class="rmain"><span class="rname">${esc(p.name)}</span>
      <span class="rsub mono">PID ${p.pid} · ${esc(parts.join(' · '))}</span></span>
      ${fedByNames(p.id).length?`<span class="fbadge" title="它的输入收到「${esc(fedByNames(p.id).join('、'))}」的声音">←</span>`:''}</div>`;
  }).join('');

  /* 右列：去向 */
  let h='<h3>输出设备</h3>';
  h+=DEVICES.map(d=>{
    const idx=cur.dev.indexOf(d.id);
    const lit=idx>=0;
    let subs='';
    if(lit){
      if(idx===0){
        subs=`<div class="ksubrow"><span>主输出音量</span>
          <span class="stp"><button onclick="np('${sel}',-5)">−</button><span class="tv mono">${PVOL[sel]} %</span><button onclick="np('${sel}',5)">＋</button></span>
          <span style="opacity:.7">只影响「${esc(cur.name)}」这一路</span></div>`;
      }else{
        subs=`<div class="ksubrow"><span>副本延迟</span>
          <span class="stp"><button onclick="nd('${d.id}',-10)">−</button><span class="tv mono">${DELAY[d.id]} ms</span><button onclick="nd('${d.id}',10)">＋</button></span>
          <span>份额</span>
          <span class="stp"><button onclick="ns('${d.id}',-5)">−</button><span class="tv mono">${SHARE[d.id]} %</span><button onclick="ns('${d.id}',5)">＋</button></span></div>`;
      }
    }
    return`<div class="krow ${lit?(idx===0?'lit':'litmir'):''}" onclick="toggleDev('${d.id}')" title="${esc(d.name)}（${esc(d.sub)}）">
      <span class="kico">${SPK_SVG}</span>
      <span class="kmain"><span class="kname">${esc(d.name)}</span><span class="ksub">${esc(d.sub)}</span></span>
      ${lit&&idx===0?'<span class="ptag">主</span>':''}</div>${subs}`;
  }).join('');
  h+='<div class="gap"></div><h3>程序输入</h3>';
  h+=PROCS.filter(p=>p.id!==sel).map(q=>{
    const lit=cur.feed.includes(q.id);
    const receiving=fedByNames(q.id).length>0;
    let subs='';
    if(lit){
      subs=`<div class="ksubrow"><span>送入音量</span>
        <span class="stp"><button onclick="nf('${q.id}',-5)">−</button><span class="tv mono">${FEEDVOL[q.id]??100} %</span><button onclick="nf('${q.id}',5)">＋</button></span></div>`;
    }
    return`<div class="krow ${lit?'litf':''}" onclick="toggleFeed('${q.id}')" title="把「${esc(cur.name)}」的声音送进「${esc(q.name)}」的输入">
      <span class="kico">${MIC_SVG}</span>
      <span class="kmain"><span class="kname">${esc(q.name)} 的输入</span>
      <span class="ksub mono">${esc(q.exe)} · ${receiving?'在收音':'未在收音'}</span></span></div>${subs}`;
  }).join('');
  document.getElementById('sinks').innerHTML=h;

  /* 计数 */
  const routedN=PROCS.filter(p=>p.dev.length>0).length;
  document.getElementById('tcount').textContent=`已路由 ${routedN} · 播放中 ${PROCS.filter(p=>p.playing).length}`;

  drawCables();
}

function drawCables(){
  const board=document.getElementById('board');
  const svg=document.getElementById('cab');
  const br=board.getBoundingClientRect();
  svg.setAttribute('width',br.width);svg.setAttribute('height',br.height);
  let out='';
  PROCS.forEach(p=>{
    const sEl=document.querySelector(`.srow[onclick="select('${p.id}')"]`);
    if(!sEl)return;
    const sr=sEl.getBoundingClientRect();
    const sx=sr.right-br.left+2, sy=sr.top+sr.height/2-br.top;
    const dim=p.id!==sel;
    p.dev.forEach((id,i)=>{
      const kEl=document.querySelector(`.krow[onclick="toggleDev('${id}')"]`);
      if(!kEl)return;
      const kr=kEl.getBoundingClientRect();
      const tx=kr.left-br.left-2, ty=kr.top+kr.height/2-br.top;
      out+=path(sx,sy,tx,ty,`${i===0?'pri':'mir'}${p.playing?' flow':''}${dim?' dim':''}`);
    });
    p.feed.forEach(id=>{
      const kEl=document.querySelector(`.krow[onclick="toggleFeed('${id}')"]`);
      if(!kEl)return;
      const kr=kEl.getBoundingClientRect();
      const tx=kr.left-br.left-2, ty=kr.top+kr.height/2-br.top;
      out+=path(sx,sy,tx,ty,`feed${p.playing?' flow':''}${dim?' dim':''}`);
    });
  });
  svg.innerHTML=out;
}
function path(sx,sy,tx,ty,cls){
  const mx=(sx+tx)/2;
  const kind=cls.split(' ')[0];
  return`<path class="cable ${cls}" d="M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}"></path>`+
    `<circle class="jack ${kind}${cls.includes('dim')?' dim':''}" cx="${sx}" cy="${sy}" r="3"></circle>`+
    `<circle class="jack ${kind}${cls.includes('dim')?' dim':''}" cx="${tx}" cy="${ty}" r="3"></circle>`;
}

render();
window.addEventListener('resize',drawCables);
</script>
</body>
</html>
