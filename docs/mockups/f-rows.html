<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 F · 一行一舞台 — App Audio Router 2.3.0 主界面提案</title>
<style>
:root{
  --bg-primary:#eef0f3;--bg-tertiary:#e8e8ec;
  --text-primary:#18181b;--text-secondary:#3f3f46;--text-muted:#71717a;
  --accent:#0891b2;--accent-hover:#0e7490;--accent-muted:rgba(8,145,178,.12);--accent-ink:#ffffff;
  --surface:#ffffff;--surface-hover:rgba(24,24,27,.035);
  --hairline:#e6e6ea;--hairline-strong:#d4d4da;
  --shadow-float:0 1px 2px rgba(24,40,66,.06),0 8px 24px rgba(24,40,66,.1);
  --type-primary:#0891b2;--type-mirror:#0f766e;--type-idle:#94a3b8;--type-feed:#b45309;
}
.dark{
  --bg-primary:#0b0e14;--bg-tertiary:#27272a;
  --text-primary:#fafafa;--text-secondary:#d4d4d8;--text-muted:#a1a1aa;
  --accent:#22d3ee;--accent-hover:#06b6d4;--accent-muted:rgba(34,211,238,.14);--accent-ink:#05222b;
  --surface:#12151a;--surface-hover:rgba(255,255,255,.035);
  --hairline:#23272e;--hairline-strong:#2e3742;
  --shadow-float:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --type-primary:#22d3ee;--type-mirror:#14b8a6;--type-idle:#64748b;--type-feed:#fbbf24;
}
*{margin:0;box-sizing:border-box}
body{min-height:100vh;background:#e3e5ea;padding:22px 0 34px;display:flex;flex-direction:column;align-items:center;gap:14px;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#18181b}
body.dark{background:#04060a;color:#fafafa}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.mnote{width:980px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:#52525b}
body.dark .mnote{color:#9494a0}
.mnote b{font-size:13px;color:#18181b}
body.dark .mnote b{color:#fafafa}
.mnote a{color:#0e7490;text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer;white-space:nowrap}
body.dark .mnote a{color:#22d3ee}
.mnote .sp{flex:1}
.tbtn2{border:1px solid #d4d4da;background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;color:#18181b}
body.dark .tbtn2{border-color:#2e3742;background:#161c24;color:#fafafa}
.win{width:980px;height:680px;flex:none;background:var(--bg-primary);border:1px solid var(--hairline-strong);border-radius:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.30);display:flex;flex-direction:column;overflow:hidden;color:var(--text-primary);position:relative}
.tbar{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.branddot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ver{font-size:10.5px;color:var(--text-muted);border:1px solid var(--hairline-strong);padding:1px 7px;border-radius:999px}
.tcount{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.tbtn{width:32px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--text-muted);cursor:pointer;font-size:12px}
.tbtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.tbtn.close:hover{background:rgba(239,68,68,.14);color:var(--error)}
.mainarea{flex:1;position:relative;display:flex;flex-direction:column;min-height:0;overflow:auto}
.chead{flex:none;display:flex;gap:16px;padding:9px 18px 7px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--hairline)}
.chead .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chead .r{margin-left:auto}
/* 行＝一条拉直的舞台 */
.chain{position:relative;display:flex;align-items:flex-start;padding:13px 18px 11px;border-bottom:1px solid var(--hairline);cursor:pointer}
.chain:hover{background:var(--surface-hover)}
.pnode{width:150px;flex:none;display:flex;flex-direction:column;gap:5px;cursor:default;padding-left:2px}
.pdisc{width:52px;height:52px;flex:none;border-radius:50%;background:var(--surface);border:1px solid var(--hairline-strong);
  box-shadow:var(--shadow-float);display:grid;place-items:center;position:relative}
.ring{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--type-idle);display:grid;place-items:center}
.ring.main{border-color:var(--type-primary)}
.ring .core{width:8px;height:8px;border-radius:50%;background:var(--type-primary);opacity:0}
.ring .core.on{opacity:1}
.pname{min-width:0;display:flex;flex-direction:column;gap:1px}
.pname .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname .sb{font-size:9.5px;color:var(--text-muted)}
.inTag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:10px;
  color:var(--type-feed);background:transparent;border:1px dashed var(--type-feed);white-space:nowrap;margin-top:2px;cursor:default}
.dests{flex:1;display:flex;align-items:flex-start;padding-top:6px;min-width:0}
.dcell{width:104px;flex:none;display:flex;flex-direction:column;align-items:center;position:relative;cursor:default}
.disc{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--hairline-strong);
  box-shadow:var(--shadow-float);display:grid;place-items:center;position:relative;transition:border-color .15s,transform .12s}
.dcell:hover .disc{border-color:var(--accent);transform:scale(1.05)}
.disc.off{background:transparent;border-color:var(--hairline-strong);box-shadow:none}
.sring{border-radius:50%;border:1.5px solid var(--type-idle);display:grid;place-items:center;width:16px;height:16px}
.sring.pri{border-color:var(--type-primary)}
.sring.mir{border-color:var(--type-mirror)}
.sring.feed{border-color:var(--type-feed)}
.sring .core{width:6px;height:6px;border-radius:50%;opacity:0}
.sring .core.on{opacity:1}
.dname{font-size:11px;font-weight:600;margin-top:4px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.drole{font-size:9.5px;min-height:13px;margin-top:1px}
.drole.pri{color:var(--type-primary)}
.drole.mir{color:var(--type-mirror)}
.drole.feed{color:var(--type-feed)}
.drole.off{color:var(--text-muted)}
.spoke{position:absolute;top:20px;pointer-events:none}
.spoke line{stroke-width:2;stroke-linecap:round}
.expx{position:absolute;right:14px;top:12px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  color:var(--text-muted);cursor:pointer;font-size:11px}
.expx:hover{background:var(--surface-hover);color:var(--text-primary)}
.disc .rm{position:absolute;right:-6px;top:-6px;width:15px;height:15px;border-radius:50%;background:var(--surface);
  border:1px solid var(--hairline-strong);display:none;place-items:center;font-size:9px;color:var(--text-muted);cursor:pointer;line-height:1}
.dcell:hover .disc .rm{display:grid}
.disc .rm:hover{color:var(--error);border-color:var(--error)}
/* 调音行 */
.trow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--hairline-strong);
  border-radius:7px;padding:0 4px;margin-top:3px}
.trow .tv{font-size:9.5px;min-width:40px;text-align:center;color:var(--text-secondary)}
.tbtn3{width:14px;height:14px;border:0;background:transparent;border-radius:4px;display:grid;place-items:center;
  font-size:10px;color:var(--text-muted);cursor:pointer;line-height:1}
.tbtn3:hover{background:var(--accent-muted);color:var(--accent)}
/* 加号 */
.addcell{width:104px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:0}
.adddisc{width:34px;height:34px;margin-top:3px;border-radius:50%;border:1px dashed var(--hairline-strong);display:grid;
  place-items:center;color:var(--text-muted);cursor:pointer;font-size:14px}
.adddisc:hover{color:var(--accent);border-color:var(--accent)}
/* 弹层 & Toast */
.pop{position:absolute;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:12px;
  box-shadow:var(--shadow-float);width:250px;padding:6px;z-index:40}
.pop .glabel{font-size:10px;color:var(--text-muted);letter-spacing:.06em;padding:6px 10px 3px}
.pop .prow{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;display:flex;gap:8px;align-items:center}
.pop .prow:hover{background:var(--surface-hover)}
.pop .prow .ds{font-size:10px;color:var(--text-muted);margin-left:auto}
.toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--hairline-strong);
  border-radius:999px;box-shadow:var(--shadow-float);padding:7px 8px 7px 16px;font-size:12.5px;display:flex;align-items:center;
  gap:10px;z-index:50;white-space:nowrap}
.toast .u{border:0;background:var(--accent-muted);color:var(--accent);font-size:12px;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="mnote">
  <b>方案 F · 一行一舞台</b>
  <span>同心圆拉直了用：每个程序一行，<b>圆盘＝去向、辐条＝路由、环＝角色、芯＝在响</b>，字母表和 2.2 的舞台一模一样，只是从"绕一圈"变成"排一行"。行尾 ＋ 添加，悬停 ✕ 撤下，行右侧箭头展开调音行。</span>
  <span class="sp"></span>
  <a href="index.html">← 全部方案</a>
  <button class="tbtn2" onclick="document.body.classList.toggle('dark')">◐ 主题</button>
</div>

<div class="win">
  <div class="tbar">
    <div class="brand"><span class="branddot"></span>App Audio Router<span class="ver mono">v2.3.0</span></div>
    <div class="tcount mono" id="tcount"></div>
    <div class="tbtn" title="设置">⚙</div>
    <div class="tbtn">—</div><div class="tbtn">□</div><div class="tbtn close">✕</div>
  </div>
  <div class="mainarea" id="main">
    <div class="chead">
      <span><span class="dot" style="background:var(--type-primary)"></span>主输出</span>
      <span><span class="dot" style="background:var(--type-mirror)"></span>副本</span>
      <span><span class="dot" style="background:var(--type-feed)"></span>送进程序</span>
      <span class="r">点行展开调音 · 悬停圆盘出现 ✕ · 行尾 ＋ 添加去向 · 改动即时生效可撤销</span>
    </div>
    <div id="rows"></div>
  </div>
  <div class="toast" id="toast" style="display:none"></div>
</div>

<script>
const DEVICES=[
  {id:'spk', name:'扬声器',      sub:'Realtek(R) Audio'},
  {id:'hp',  name:'WH-1000XM5', sub:'蓝牙耳机'},
  {id:'hdmi',name:'DELL U2723', sub:'HDMI'},
];
const DEF='spk';
const PROCS=[
  {id:'spotify',name:'Spotify',        exe:'spotify.exe',       pid:8124, playing:true,  dev:['spk','hp'], feed:['discord']},
  {id:'edge',   name:'Microsoft Edge', exe:'msedge.exe',        pid:9312, playing:true,  dev:[],           feed:['obs']},
  {id:'discord',name:'Discord',        exe:'Discord.exe',       pid:7788, playing:true,  dev:[],           feed:[]},
  {id:'obs',    name:'OBS Studio',     exe:'obs64.exe',         pid:6420, playing:false, dev:[],           feed:[]},
  {id:'game',   name:'Cyberpunk 2077', exe:'Cyberpunk2077.exe', pid:5120, playing:true,  dev:['hp'],       feed:[]},
];
const DELAY={spk:0,hdmi:0,hp:40};
const SHARE={spk:100,hdmi:100,hp:100};
const FEEDVOL={discord:80,obs:60};
const PVOL={spotify:100,edge:100,discord:100,obs:100,game:100};

const open=new Set(['spotify']);   // 默认展开第一行
let popFor=null;
const P=id=>PROCS.find(p=>p.id===id);
const D=id=>DEVICES.find(d=>d.id===id);
const fedBy=id=>PROCS.filter(p=>p.feed.includes(id));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function snapshot(){return JSON.stringify(PROCS.map(p=>({id:p.id,dev:[...p.dev],feed:[...p.feed]})))}
function restore(s){JSON.parse(s).forEach(r=>{const p=P(r.id);p.dev=r.dev;p.feed=r.feed})}
let undoSnap=null,undoTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg)+(undoSnap?' <button class="u" onclick="doUndo()">撤销</button>':'');
  t.style.display='flex';
  clearTimeout(undoTimer);undoTimer=setTimeout(()=>t.style.display='none',8000);
}
function doUndo(){if(undoSnap)restore(undoSnap);undoSnap=null;closePop();render();document.getElementById('toast').style.display='none'}
function toggleRow(id){open.has(id)?open.delete(id):open.add(id);render()}

function removeDest(pid,kind,id){
  undoSnap=snapshot();
  const p=P(pid);
  if(kind==='dev'){if(p.dev.length>1)p.dev=p.dev.filter(x=>x!==id);else{undoSnap=null;return}}
  else p.feed=p.feed.filter(x=>x!==id);
  render();
  const nm=kind==='dev'?D(id).name:P(id).name+' 的输入';
  showToast(`已把「${p.name}」从 ${nm} 撤下。`);
}
function addDest(pid,kind,id){
  undoSnap=snapshot();
  const p=P(pid);
  if(kind==='dev'){if(!p.dev.includes(id))p.dev.push(id)}
  else if(!p.feed.includes(id))p.feed.push(id);
  closePop();render();
  const nm=kind==='dev'?D(id).name:P(id).name+' 的输入';
  showToast(`已把「${p.name}」接到 ${nm}。`);
}
function openPop(pid,evt){
  const tr=evt.currentTarget.getBoundingClientRect();
  popFor=pid;render();
  const pop=document.getElementById('pop');
  if(!pop)return;
  const main=document.getElementById('main');
  const mr=main.getBoundingClientRect();
  pop.style.left=Math.max(6,Math.min(tr.left-mr.left-60+main.scrollLeft,mr.width-266))+'px';
  pop.style.top=Math.min(tr.bottom-mr.top+6+main.scrollTop,main.clientHeight-280)+'px';
}
function closePop(){popFor=null;const p=document.getElementById('pop');if(p)p.remove()}
function nd(id,d){DELAY[id]=Math.max(0,Math.min(200,DELAY[id]+d));render()}
function ns(id,d){SHARE[id]=Math.max(0,Math.min(100,SHARE[id]+d));render()}
function nf(id,d){FEEDVOL[id]=Math.max(0,Math.min(100,(FEEDVOL[id]??100)+d));render()}
function npv(id,d){PVOL[id]=Math.max(5,Math.min(100,PVOL[id]+d));render()}

function spokeSvg(width,left,cls,live,arrow){
  const stroke=`var(--${cls==='off'?'type-idle':cls==='pri'?'type-primary':cls==='mir'?'type-mirror':'type-feed'})`;
  return`<svg class="spoke" style="left:${left}px" width="${width+8}" height="12">
    <line x1="2" y1="6" x2="${width+2}" y2="6" stroke="${stroke}" ${live?'stroke-dasharray="4 8"':''} opacity="${live?1:.55}"
      ${live?`style="animation:dashF .6s linear infinite"`:''}></line>
    ${arrow?`<path d="M${width-4} 2 L${width+2} 6 L${width-4} 10" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="${live?1:.55}"></path>`:''}
  </svg>`;
}

function render(){
  const sorted=[...PROCS].sort((a,b)=>(b.dev.length>0)-(a.dev.length>0));
  document.getElementById('rows').innerHTML=sorted.map(p=>{
    const isOpen=open.has(p.id);
    const live=p.playing&&(p.dev.length||p.feed.length);
    const fed=fedBy(p.id);
    /* 目的地圆盘序列 */
    const cells=[];
    p.dev.forEach((id,k)=>{
      const d=D(id);
      const role=k===0?'pri':'mir';
      const roleWord=k===0?'主输出':'副本';
      const tone=role;
      let tuner='';
      if(isOpen){
        if(k===0){
          tuner=`<div class="trow" title="主输出音量：程序的会话音量"><button class="tbtn3" onclick="event.stopPropagation();npv('${p.id}',-5)">−</button><span class="tv mono">${PVOL[p.id]} %</span><button class="tbtn3" onclick="event.stopPropagation();npv('${p.id}',5)">＋</button></div>`;
        }else{
          tuner=`<div class="trow" title="软件侧延迟补偿"><button class="tbtn3" onclick="event.stopPropagation();nd('${id}',-10)">−</button><span class="tv mono">${DELAY[id]} ms</span><button class="tbtn3" onclick="event.stopPropagation();nd('${id}',10)">＋</button></div>
          <div class="trow" title="这台设备作为副本的响度份额"><button class="tbtn3" onclick="event.stopPropagation();ns('${id}',-5)">−</button><span class="tv mono">${SHARE[id]} %</span><button class="tbtn3" onclick="event.stopPropagation();ns('${id}',5)">＋</button></div>`;
        }
      }
      cells.push({kind:'dev',id,role,roleWord,name:d.name,tuner,
        title:`${d.name}（${d.sub}）${k===0?' · 主输出，系统直连':' · 副本'}`});
    });
    p.feed.forEach(id=>{
      const q=P(id);
      let tuner='';
      if(isOpen)tuner=`<div class="trow" title="送进这个程序的音量"><button class="tbtn3" onclick="event.stopPropagation();nf('${id}',-5)">−</button><span class="tv mono">${FEEDVOL[id]??100} %</span><button class="tbtn3" onclick="event.stopPropagation();nf('${id}',5)">＋</button></div>`;
      cells.push({kind:'feed',id,role:'feed',roleWord:'送入',name:q.name,tuner,
        title:`把「${p.name}」的声音送进「${q.name}」的输入`});
    });

    let cellHtml='';
    cells.forEach((c,ci)=>{
      const first=ci===0;
      /* 第一根辐条从程序盘右缘（行内 x≈72）到第一枚去向盘左缘（dcell 内 x=32）；其余辐条填 64px 间隙 */
      cellHtml+=`<div class="dcell">
        ${spokeSvg(first?128:64,first?-96:-32,c.role,live,c.kind==='feed')}
        <div class="disc" title="${esc(c.title)}">
          <span class="sring ${c.role}"><span class="core ${live?'on':''}"></span></span>
          <span class="rm" title="撤下" onclick="event.stopPropagation();removeDest('${p.id}','${c.kind}','${c.id}')">✕</span>
        </div>
        <div class="dname" title="${esc(c.name)}">${esc(c.name)}</div>
        <div class="drole ${c.role}">${c.roleWord}</div>
        ${c.tuner}
      </div>`;
    });
    if(p.dev.length===0&&p.feed.length===0){
      cellHtml+=`<div class="dcell">
        ${spokeSvg(128,-96,'off',false,false)}
        <div class="disc off" title="跟着系统默认设备（${esc(D(DEF).name)}）走；点行尾 ＋ 添加去向">
          <span class="sring"><span class="core ${p.playing?'on':''}" style="background:var(--type-idle)"></span></span></div>
        <div class="dname" style="color:var(--text-muted)">${esc(D(DEF).name)}</div>
        <div class="drole off">跟随系统默认</div>
      </div>`;
    }
    cellHtml+=`<div class="addcell"><div class="adddisc" title="添加去向" onclick="event.stopPropagation();openPop('${p.id}',event)">＋</div></div>`;

    return`<div class="chain" onclick="toggleRow('${p.id}')">
      <span class="pnode">
        <span class="pdisc"><span class="ring ${p.dev.length?'main':''}"><span class="core ${p.playing?'on':''}"></span></span></span>
        <span class="pname"><span class="nm">${esc(p.name)}</span>
          <span class="sb mono">PID ${p.pid} · ${esc(p.exe)}</span>
          ${fed.length?`<span class="inTag" title="它的输入收到「${esc(fed.map(f=>f.name).join('、'))}」的声音">← ${esc(fed.map(f=>f.name).join('、'))}</span>`:''}
        </span>
      </span>
      <span class="dests">${cellHtml}</span>
      <span class="expx" title="${isOpen?'收起调音':'展开调音'}" onclick="event.stopPropagation();toggleRow('${p.id}')">${isOpen?'⌃':'⌄'}</span>
    </div>`;
  }).join('')+(popFor?buildPop(popFor):'');

  const routedN=PROCS.filter(p=>p.dev.length>0).length;
  document.getElementById('tcount').textContent=`已路由 ${routedN} · 播放中 ${PROCS.filter(p=>p.playing).length}`;
}

function buildPop(pid){
  const p=P(pid);
  let h='<div class="pop" id="pop" onclick="event.stopPropagation()">';
  h+='<div class="glabel">输出设备</div>';
  h+=DEVICES.map(d=>p.dev.includes(d.id)
    ?`<div class="prow" style="opacity:.4;cursor:default">${esc(d.name)}<span class="ds">已接</span></div>`
    :`<div class="prow" onclick="addDest('${pid}','dev','${d.id}')">${esc(d.name)}<span class="ds">${esc(d.sub)}</span></div>`).join('');
  h+='<div class="glabel">程序输入</div>';
  h+=PROCS.filter(q=>q.id!==pid).map(q=>p.feed.includes(q.id)
    ?`<div class="prow" style="opacity:.4;cursor:default">${esc(q.name)} 的输入<span class="ds">已接</span></div>`
    :`<div class="prow" onclick="addDest('${pid}','feed','${q.id}')">${esc(q.name)} 的输入</div>`).join('');
  return h+'</div>';
}

render();
document.addEventListener('pointerdown',e=>{
  if(popFor&&!e.target.closest('.pop')&&!e.target.closest('.adddisc'))closePop();
});
</script>
<style>@keyframes dashF{to{stroke-dashoffset:-12}}</style>
</body>
