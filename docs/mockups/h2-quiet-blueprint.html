<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 H2 · 安静的蓝图 — App Audio Router 2.3.0 主界面提案</title>
<style>
:root{
  --bg-primary:#eef0f3;--bg-tertiary:#e8e8ec;
  --text-primary:#18181b;--text-secondary:#3f3f46;--text-muted:#71717a;
  --accent:#0891b2;--accent-hover:#0e7490;--accent-muted:rgba(8,145,178,.12);--accent-ink:#ffffff;
  --surface:#ffffff;--surface-hover:rgba(24,24,27,.035);
  --hairline:#e6e6ea;--hairline-strong:#d4d4da;
  --shadow-float:0 1px 2px rgba(24,40,66,.06),0 8px 24px rgba(24,40,66,.1);
  --type-primary:#0891b2;--type-mirror:#0f766e;--type-idle:#94a3b8;--type-feed:#b45309;
}
.dark{
  --bg-primary:#0b0e14;--bg-tertiary:#27272a;
  --text-primary:#fafafa;--text-secondary:#d4d4d8;--text-muted:#a1a1aa;
  --accent:#22d3ee;--accent-hover:#06b6d4;--accent-muted:rgba(34,211,238,.14);--accent-ink:#05222b;
  --surface:#12151a;--surface-hover:rgba(255,255,255,.035);
  --hairline:#23272e;--hairline-strong:#2e3742;
  --shadow-float:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --type-primary:#22d3ee;--type-mirror:#14b8a6;--type-idle:#64748b;--type-feed:#fbbf24;
}
*{margin:0;box-sizing:border-box}
body{min-height:100vh;background:#e3e5ea;padding:22px 0 34px;display:flex;flex-direction:column;align-items:center;gap:14px;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#18181b}
body.dark{background:#04060a;color:#fafafa}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.mnote{width:980px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:#52525b}
body.dark .mnote{color:#9494a0}
.mnote b{font-size:13px;color:#18181b}
body.dark .mnote b{color:#fafafa}
.mnote a{color:#0e7490;text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer;white-space:nowrap}
body.dark .mnote a{color:#22d3ee}
.mnote .sp{flex:1}
.tbtn2{border:1px solid #d4d4da;background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;color:#18181b}
body.dark .tbtn2{border-color:#2e3742;background:#161c24;color:#fafafa}
.win{width:980px;height:680px;flex:none;background:var(--bg-primary);border:1px solid var(--hairline-strong);border-radius:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.30);display:flex;flex-direction:column;overflow:hidden;color:var(--text-primary);position:relative}
.tbar{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.branddot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ver{font-size:10.5px;color:var(--text-muted);border:1px solid var(--hairline-strong);padding:1px 7px;border-radius:999px}
.tcount{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.tbtn{width:32px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--text-muted);cursor:pointer;font-size:12px}
.tbtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.tbtn.close:hover{background:rgba(239,68,68,.14);color:var(--error)}
.tabs{height:32px;flex:none;display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--hairline);font-size:12.5px;color:var(--text-muted)}
.tab{padding:8px 2px;position:relative}
.tab.on{color:var(--text-primary);font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
/* 画布：平坦、无点阵 */
.canvaswrap{flex:1;overflow:auto;position:relative}
#canvas{position:relative;width:940px;height:512px;margin:0 auto}
#wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.gcap{position:absolute;font-size:10.5px;color:var(--text-muted);letter-spacing:.1em}
/* 线：默认安静，点亮才说话 */
.wline{fill:none;stroke-linecap:round}
.qwire .wline{stroke-width:1.5;opacity:.32}
.qwire.pri .wline{opacity:.5}
.qwire.lit .wline{stroke-width:2.5;opacity:1}
.qwire .live{stroke-dasharray:none}
.qwire.lit .live{stroke-dasharray:4 10;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.wline.pri{stroke:var(--type-primary)}
.wline.mir{stroke:var(--type-mirror)}
.wline.feed{stroke:var(--type-feed)}
#wires .wgrp{pointer-events:stroke;cursor:pointer}
#wires .badge{opacity:0;transition:opacity .12s}
#wires .wgrp:hover .badge{opacity:1}
#tmpwire{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 6;opacity:.85}
#tmpwire.snap{stroke-dasharray:none;opacity:1}
/* 节点卡：一行名字 */
.bpnode{position:absolute;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:11px;
  box-shadow:var(--shadow-float);padding:8px 14px;transition:border-color .15s}
.bpnode:hover{border-color:var(--accent)}
.bpnode.sel{border-color:var(--accent);box-shadow:var(--shadow-float),0 0 0 3px var(--accent-muted)}
.bpnode.src{width:240px;height:54px}
.bpnode.snk{width:230px;height:50px}
.bphead{display:flex;align-items:center;gap:9px;min-width:0}
.bphead .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpsub{font-size:9.5px;color:var(--text-muted);margin-top:1px}
.ring{width:15px;height:15px;flex:none;border-radius:50%;border:1.5px solid var(--hairline-strong);display:grid;place-items:center}
.ring.main{border-color:var(--type-primary)}
.ring .core{width:6px;height:6px;border-radius:50%;background:var(--type-primary);opacity:0}
.ring .core.on{opacity:1}
.mic{color:var(--text-muted);flex:none}
.mic.hot{color:var(--type-feed)}
/* 端口 */
.port{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);
  cursor:crosshair;transition:transform .12s,box-shadow .12s;z-index:6}
.port::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .12s}
.port.full::after{opacity:1}
.port:hover{transform:scale(1.25);box-shadow:0 0 0 4px var(--accent-muted)}
.port.out{right:-8px;top:50%;margin-top:-7.5px}
.port.in{left:-8px;top:50%;margin-top:-7.5px}
.port.in.micp{border-color:var(--type-feed)}
.port.in.micp::after{background:var(--type-feed)}
.port.self{opacity:.25;pointer-events:none}
.port.aim{box-shadow:0 0 0 5px var(--accent-muted);transform:scale(1.2)}
.port.armed{animation:armedp 1s ease-in-out infinite}
@keyframes armedp{0%,100%{box-shadow:0 0 0 3px var(--accent-muted)}50%{box-shadow:0 0 0 7px var(--accent-muted)}}
/* 检查器 */
.insp{flex:none;border-top:1px solid var(--hairline);min-height:76px;padding:11px 22px;display:flex;align-items:center;gap:22px;overflow-x:auto}
.insp .hint{font-size:11.5px;color:var(--text-muted)}
.insp .who{display:flex;align-items:center;gap:9px;flex:none}
.insp .who .nm{font-weight:700;font-size:13px}
.item{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:9px;
  padding:4px 8px;font-size:11px;white-space:nowrap}
.item .lb{color:var(--text-secondary)}
.stp{display:flex;align-items:center;gap:4px}
.stp .tv{font-size:11px;min-width:46px;text-align:center;color:var(--text-secondary)}
.stp button{width:17px;height:17px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;
  font-size:11px;color:var(--text-muted);cursor:pointer;line-height:1}
.stp button:hover{background:var(--accent-muted);color:var(--accent)}
/* Toast */
.toast{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--hairline-strong);
  border-radius:999px;box-shadow:var(--shadow-float);padding:7px 8px 7px 16px;font-size:12.5px;display:flex;align-items:center;
  gap:10px;z-index:50;white-space:nowrap}
.toast .u{border:0;background:var(--accent-muted);color:var(--accent);font-size:12px;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="mnote">
  <b>方案 H2 · 安静的蓝图</b>
  <span>针对 H 的「乱」重做：<b>程序合并成一张双孔卡</b>（左孔＝输入、右孔＝输出，13 卡变 8 卡）；<b>线默认是安静的细线</b>，悬停某张卡时只有它的线点亮流动——平时看拓扑，注视看电路；送进程序走<b>贴柱回勾线</b>与设备线分道；去掉点阵与提示条，一屏放下不滚动。</span>
  <span class="sp"></span>
  <a href="index.html">← 全部方案</a>
  <button class="tbtn2" onclick="document.body.classList.toggle('dark')">◐ 主题</button>
</div>

<div class="win">
  <div class="tbar">
    <div class="brand"><span class="branddot"></span>App Audio Router<span class="ver mono">v2.3.0</span></div>
    <div class="tcount mono" id="tcount"></div>
    <div class="tbtn" title="设置">⚙</div>
    <div class="tbtn">—</div><div class="tbtn">□</div><div class="tbtn close">✕</div>
  </div>
  <div class="tabs"><span class="tab on">路由</span><span class="tab">活动</span></div>
  <div class="canvaswrap">
    <div id="canvas">
      <svg id="wires" width="940" height="512">
        <g id="wgrps"></g>
        <path id="tmpwire" d="" style="display:none"></path>
      </svg>
      <div id="nodes" style="position:absolute;inset:0"></div>
    </div>
  </div>
  <div class="insp" id="insp"></div>
  <div class="toast" id="toast" style="display:none"></div>
</div>

<script>
const DEVICES=[
  {id:'spk', name:'扬声器',      sub:'Realtek(R) Audio'},
  {id:'hp',  name:'WH-1000XM5', sub:'蓝牙耳机'},
  {id:'hdmi',name:'DELL U2723', sub:'HDMI'},
];
const DEF='spk';
/* 右列设备按「第一个用到它的程序」排序，减少交叉 */
const DEV_ORDER=['spk','hp','hdmi'];
const PROCS=[
  {id:'spotify',name:'Spotify',        exe:'spotify.exe',       pid:8124, playing:true,  dev:['spk','hp'], feed:['discord']},
  {id:'edge',   name:'Microsoft Edge', exe:'msedge.exe',        pid:9312, playing:true,  dev:[],           feed:['obs']},
  {id:'discord',name:'Discord',        exe:'Discord.exe',       pid:7788, playing:true,  dev:[],           feed:[]},
  {id:'obs',    name:'OBS Studio',     exe:'obs64.exe',         pid:6420, playing:false, dev:[],           feed:[]},
  {id:'game',   name:'Cyberpunk 2077', exe:'Cyberpunk2077.exe', pid:5120, playing:true,  dev:['hp'],       feed:[]},
];
const DELAY={spk:0,hdmi:0,hp:40};
const SHARE={spk:100,hdmi:100,hp:100};
const FEEDVOL={discord:80,obs:60};
const PVOL={spotify:100,edge:100,discord:100,obs:100,game:100};

const SRC_X=70,SRC_W=240,SNK_X=650,SNK_W=230;
const SRC_Y0=64,SRC_DY=88,SNK_Y0=96,SNK_DY=96;
let selected=null,drag=null,armed=null;
const P=id=>PROCS.find(p=>p.id===id);
const D=id=>DEVICES.find(d=>d.id===id);
const DEV_IDX=Object.fromEntries(DEV_ORDER.map((d,i)=>[d,i]));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

const srcPos=id=>({x:SRC_X,y:SRC_Y0+PROCS.findIndex(p=>p.id===id)*SRC_DY,w:SRC_W,h:54});
const snkPos=id=>({x:SNK_X,y:SNK_Y0+DEV_IDX[id]*SNK_DY,w:SNK_W,h:50});
const outPort=id=>{const p=srcPos(id);return{x:p.x+p.w+8,y:p.y+p.h/2}};
const devIn=id=>{const p=snkPos(id);return{x:p.x-8,y:p.y+p.h/2}};
const progIn=id=>{const p=srcPos(id);return{x:p.x-8,y:p.y+p.h/2}};

function snapshot(){return JSON.stringify(PROCS.map(p=>({id:p.id,dev:[...p.dev],feed:[...p.feed]})))}
function restore(s){JSON.parse(s).forEach(r=>{const p=P(r.id);p.dev=r.dev;p.feed=r.feed})}
let undoSnap=null,undoTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg)+(undoSnap?' <button class="u" onclick="doUndo()">撤销</button>':'');
  t.style.display='flex';
  clearTimeout(undoTimer);undoTimer=setTimeout(()=>t.style.display='none',8000);
}
function doUndo(){if(undoSnap)restore(undoSnap);undoSnap=null;render();document.getElementById('toast').style.display='none'}
function nd(id,d){DELAY[id]=Math.max(0,Math.min(200,DELAY[id]+d));render()}
function ns(id,d){SHARE[id]=Math.max(0,Math.min(100,SHARE[id]+d));render()}
function nf(id,d){FEEDVOL[id]=Math.max(0,Math.min(100,(FEEDVOL[id]??100)+d));render()}
function np(id,d){PVOL[id]=Math.max(5,Math.min(100,PVOL[id]+d));render()}
function connect(pid,kind,id){
  const p=P(pid);
  const has=kind==='dev'?p.dev.includes(id):p.feed.includes(id);
  if(has)return;
  undoSnap=snapshot();
  if(kind==='dev')p.dev.push(id);else p.feed.push(id);
  const nm=kind==='dev'?D(id).name:P(id).name;
  showToast(`已接：「${p.name}」→ ${nm}${kind==='feed'?' 的输入':''}。`);
  render();
}
function removeWire(pid,kind,id){
  undoSnap=snapshot();
  const p=P(pid);
  if(kind==='dev'){if(p.dev.length>1)p.dev=p.dev.filter(x=>x!==id);else{undoSnap=null;return}}
  else p.feed=p.feed.filter(x=>x!==id);
  const nm=kind==='dev'?D(id).name:P(id).name;
  showToast(`已撤线：「${p.name}」↛ ${nm}${kind==='feed'?' 的输入':''}。`);
  render();
}

function devPath(a,b){
  const dx=Math.max(90,(b.x-a.x)*0.4);
  return`M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
}
/* 送线：贴柱回勾（从出孔向右鼓出一个弧，再折回目标的入孔） */
function feedPath(a,b){
  const B=78+Math.abs(b.y-a.y)*0.18;
  return`M ${a.x} ${a.y} C ${a.x+B} ${a.y}, ${b.x+B} ${b.y}, ${b.x} ${b.y}`;
}
function render(){
  let w='';
  PROCS.forEach(p=>{
    p.dev.forEach((id,k)=>{
      const cls=k===0?'pri':'mir';
      w+=`<g class="wgrp qwire ${cls}" data-src="${p.id}" data-dst="dev:${id}">
        <path class="wline ${cls}${p.playing?' live':''}" d="${devPath(outPort(p.id),devIn(id))}"></path>
        <g class="badge" transform="translate(${(outPort(p.id).x+devIn(id).x)/2},${(outPort(p.id).y+devIn(id).y)/2})">
          <circle r="9" fill="var(--surface)" stroke="var(--hairline-strong)"></circle>
          <text y="3.5" text-anchor="middle" font-size="10" fill="var(--text-muted)" style="pointer-events:none">✕</text></g></g>`;
    });
    p.feed.forEach(id=>{
      const a=outPort(p.id),b=progIn(id);
      const midx=(a.x+b.x)/2+60;
      w+=`<g class="wgrp qwire feed" data-src="${p.id}" data-dst="feed:${id}">
        <path class="wline feed${p.playing?' live':''}" d="${feedPath(a,b)}"></path>
        <path d="M ${b.x+7} ${b.y-4} L ${b.x} ${b.y} L ${b.x+7} ${b.y+4}" fill="none" stroke="var(--type-feed)" stroke-width="1.6" stroke-linecap="round"></path>
        <g class="badge" transform="translate(${midx},${(a.y+b.y)/2})">
          <circle r="9" fill="var(--surface)" stroke="var(--hairline-strong)"></circle>
          <text y="3.5" text-anchor="middle" font-size="10" fill="var(--text-muted)" style="pointer-events:none">✕</text></g></g>`;
    });
  });
  document.getElementById('wgrps').innerHTML=w;

  let n='';
  n+=`<div class="gcap" style="left:${SRC_X}px;top:34px">程序　　左孔＝收音　右孔＝输出</div>`;
  n+=`<div class="gcap" style="left:${SNK_X}px;top:64px">输出设备</div>`;
  PROCS.forEach(p=>{
    const pos=srcPos(p.id);
    const fed=PROCS.some(q=>q.feed.includes(p.id));
    n+=`<div class="bpnode src ${selected===p.id?'sel':''}" style="left:${pos.x}px;top:${pos.y}px" data-node="${p.id}">
      <div class="bphead"><span class="ring ${p.dev.length?'main':''}"><span class="core ${p.playing?'on':''}"></span></span>
      <span class="nm">${esc(p.name)}</span></div>
      <div class="bpsub mono" style="padding-left:24px">${esc(p.exe)} · PID ${p.pid}</div>
      <span class="port out ${p.dev.length||p.feed.length?'full':''} ${armed===p.id?'armed':''}" data-out="${p.id}" title="${esc(p.name)} 的输出"></span>
      <span class="port in micp ${fed?'full':''} ${(drag&&drag.pid===p.id)||(armed&&armed.pid===p.id)?'self':''}" data-in="feed:${p.id}" title="把某个程序的声音送进「${esc(p.name)}」"></span>
    </div>`;
  });
  DEV_ORDER.forEach(id=>{
    const d=D(id),pos=snkPos(id);
    const users=PROCS.filter(p=>p.dev.includes(id));
    n+=`<div class="bpnode snk" style="left:${pos.x}px;top:${pos.y}px" data-dev="${id}">
      <div class="bphead"><svg width="14" height="14" viewBox="0 0 14 14" style="color:var(--text-muted);flex:none"><path d="M2 5h2.5L8 2v10L4.5 9H2z" fill="currentColor"/></svg>
      <span class="nm">${esc(d.name)}</span></div>
      <div class="bpsub" style="padding-left:23px">${esc(d.sub)}</div>
      <span class="port in ${users.length?'full':''}" data-in="dev:${id}" title="把某个程序拉到这里"></span>
    </div>`;
  });
  document.getElementById('nodes').innerHTML=n;

  const insp=document.getElementById('insp');
  if(!selected||!P(selected)){
    insp.innerHTML='<span class="hint">悬停一张卡，看它的线；从右孔拉到左孔即连接（或点右孔再点左孔）；点卡片在这里调音。</span>';
  }else{
    const p=P(selected);
    let items='';
    if(p.dev.length===0)items=`<span class="hint">未路由到设备 —— 跟着系统默认设备（${esc(D(DEF).name)}）走。</span>`;
    else p.dev.forEach((id,k)=>{
      if(k===0)items+=`<div class="item"><span class="lb" style="color:var(--type-primary)">主输出</span><b>${esc(D(id).name)}</b>
        <span class="lb">会话音量</span><span class="stp"><button onclick="np('${p.id}',-5)">−</button><span class="tv mono">${PVOL[p.id]} %</span><button onclick="np('${p.id}',5)">＋</button></span></div>`;
      else items+=`<div class="item"><span class="lb" style="color:var(--type-mirror)">副本</span><b>${esc(D(id).name)}</b>
        <span class="lb">延迟</span><span class="stp"><button onclick="nd('${id}',-10)">−</button><span class="tv mono">${DELAY[id]} ms</span><button onclick="nd('${id}',10)">＋</button></span>
        <span class="lb">份额</span><span class="stp"><button onclick="ns('${id}',-5)">−</button><span class="tv mono">${SHARE[id]} %</span><button onclick="ns('${id}',5)">＋</button></span></div>`;
    });
    p.feed.forEach(id=>{
      items+=`<div class="item"><span class="lb" style="color:var(--type-feed)">送入</span><b>${esc(P(id).name)}</b>
        <span class="lb">音量</span><span class="stp"><button onclick="nf('${id}',-5)">−</button><span class="tv mono">${FEEDVOL[id]??100} %</span><button onclick="nf('${id}',5)">＋</button></span></div>`;
    });
    insp.innerHTML=`<div class="who">
      <span class="ring ${p.dev.length?'main':''}"><span class="core ${p.playing?'on':''}"></span></span>
      <span><span class="nm">${esc(p.name)}</span><br><span class="bpsub mono" style="padding:0">${esc(p.exe)} · ${p.playing?'正在播放':'未在播放'}</span></span></div>${items}`;
  }

  const routedN=PROCS.filter(p=>p.dev.length>0).length;
  document.getElementById('tcount').textContent=`已路由 ${routedN} · 播放中 ${PROCS.filter(p=>p.playing).length}`;
}

/* ---- 悬停点亮：看哪张卡，亮哪条线 ---- */
document.getElementById('nodes').addEventListener('mouseover',e=>{
  const card=e.target.closest('.bpnode');
  document.querySelectorAll('.wgrp.qwire').forEach(g=>g.classList.remove('lit'));
  if(!card)return;
  const key=card.dataset.node?`src:${card.dataset.node}`:card.dataset.dev?`dev:${card.dataset.dev}`:null;
  if(card.dataset.node){
    document.querySelectorAll(`.wgrp.qwire[data-src="${card.dataset.node}"]`).forEach(g=>g.classList.add('lit'));
  }else if(card.dataset.dev){
    document.querySelectorAll(`.wgrp.qwire[data-dst="dev:${card.dataset.dev}"]`).forEach(g=>g.classList.add('lit'));
  }
});
document.getElementById('nodes').addEventListener('mouseout',e=>{
  const card=e.target.closest('.bpnode');
  if(card&&!card.contains(e.relatedTarget)){
    document.querySelectorAll('.wgrp.qwire').forEach(g=>g.classList.remove('lit'));
  }
});

/* ---- 拉线交互（同 H：拖 or 点出孔→点入孔） ---- */
const canvas=document.getElementById('canvas');
function canvasXY(e){
  const r=canvas.getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function setTmp(x1,y1,x2,y2,snap,feed){
  const t=document.getElementById('tmpwire');
  t.style.display='block';
  t.setAttribute('d',feed?feedPath({x:x1,y:y1},{x:x2,y:y2}):devPath({x:x1,y:y1},{x:x2,y:y2}));
  t.classList.toggle('snap',!!snap);
}
function hideTmp(){document.getElementById('tmpwire').style.display='none'}
function nearestInPort(x,y,maxR){
  let best=null,bd=maxR;
  document.querySelectorAll('.port.in').forEach(el=>{
    if(el.classList.contains('self'))return;
    const r=el.getBoundingClientRect(),cr=canvas.getBoundingClientRect();
    const cx=r.left-cr.left+r.width/2,cy=r.top-cr.top+r.height/2;
    const dist=Math.hypot(cx-x,cy-y);
    if(dist<bd){bd=dist;best=el}
  });
  return best;
}
function clearAim(){document.querySelectorAll('.port.aim').forEach(el=>el.classList.remove('aim'))}

document.getElementById('nodes').addEventListener('pointerdown',e=>{
  const out=e.target.closest('.port.out');
  const inP=e.target.closest('.port.in');
  if(out){
    e.preventDefault();
    drag={pid:out.dataset.out,moved:false,x0:e.clientX,y0:e.clientY};
    armed=null;render();
  }else if(inP){
    e.preventDefault();
    if(armed){
      const [kind,id]=inP.dataset.in.split(':');
      const from=armed.pid;armed=null;
      connect(from,kind,id);
    }
  }else{
    const node=e.target.closest('.bpnode.src');
    selected=node?node.dataset.node:null;
    if(armed)armed=null;
    render();
  }
});
document.addEventListener('pointermove',e=>{
  const from=drag?drag.pid:armed?armed.pid:null;
  if(!from)return;
  const a=outPort(from);
  const c=canvasXY(e);
  const tgt=nearestInPort(c.x,c.y,30);
  clearAim();
  if(tgt){
    tgt.classList.add('aim');
    const [kind,id]=tgt.dataset.in.split(':');
    const b=kind==='dev'?devIn(id):progIn(id);
    setTmp(a.x,a.y,b.x,b.y,true,kind==='feed');
  }else setTmp(a.x,a.y,c.x,c.y,false,false);
  if(drag&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>5)drag.moved=true;
});
document.addEventListener('pointerup',e=>{
  if(!drag)return;
  const c=canvasXY(e);
  const tgt=nearestInPort(c.x,c.y,30);
  if(tgt){
    const [kind,id]=tgt.dataset.in.split(':');
    connect(drag.pid,kind,id);
    drag=null;hideTmp();clearAim();
  }else if(!drag.moved){
    armed={pid:drag.pid};
    drag=null;render();
  }else{
    drag=null;hideTmp();clearAim();
  }
});
document.getElementById('wgrps').addEventListener('click',e=>{
  const g=e.target.closest('.wgrp');
  if(!g)return;
  const src=g.dataset.src;
  const [kind,id]=g.dataset.dst.split(':');
  removeWire(src,kind,id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){armed=null;if(drag)drag=null;hideTmp();clearAim();render()}
});

render();
</script>
</body>
</html>
